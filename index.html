<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text → Image / WordArt Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@300..800&family=Montserrat:wght@300..800&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f1220;
  color: #fff;
}

header {
  padding: 12px 16px;
  background: #15183a;
  font-weight: 600;
}

main {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: calc(100vh - 50px);
}

.controls {
  overflow-y: auto;
  padding: 12px;
  background: #0c0f25;
  border-right: 1px solid #222;
}

.controls h3 {
  margin-top: 16px;
  font-size: 14px;
  opacity: .9;
}

.controls label {
  font-size: 12px;
  display: block;
  margin-top: 8px;
}

.controls input,
.controls select,
.controls textarea,
.controls button {
  width: 100%;
  margin-top: 4px;
  background: #1a1f45;
  border: none;
  color: #fff;
  padding: 6px;
  border-radius: 6px;
}

.controls button {
  cursor: pointer;
  background: #4f6bff;
  font-weight: 600;
}

.preview-area {
  overflow: auto;
  padding: 24px;
  background: #080a18;
}

#renderBox {
  display: inline-block;
  padding: 40px;
  background: linear-gradient(135deg, #111, #222);
  border-radius: 16px;
  min-width: 400px;
}

.word {
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
}

.word.selected {
  outline: 2px dashed #4f6bff;
}

.glow {
  text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
}

.stroke {
  -webkit-text-stroke: var(--strokeWidth, 2px) currentColor;
}

.skew {
  transform: skew(-12deg);
}

svg {
  overflow: visible;
}

.anim-pulse {
  animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}
</style>
</head>

<body>

<header>Text → Image • WordArt • Animation Studio</header>

<main>

<div class="controls">

<h3>Text Input</h3>
<textarea id="textInput" rows="6">Click words to style them individually</textarea>

<button onclick="renderText()">Render Text</button>

<h3>Typography</h3>
<label>Font</label>
<select id="fontSelect" onchange="updateStyle()">
  <option>Inter</option>
  <option>Poppins</option>
  <option>Montserrat</option>
</select>

<label>Font Size</label>
<input type="range" min="16" max="120" value="40" id="fontSize" oninput="updateStyle()">

<label>Stroke Width</label>
<input type="range" min="0" max="8" value="0" id="strokeWidth" oninput="updateStyle()">

<label>Text Color</label>
<input type="color" id="textColor" value="#ffffff" onchange="applyToSelected()">

<label>Glow</label>
<input type="checkbox" id="glowToggle" onchange="applyToSelected()">

<label>Skew</label>
<input type="checkbox" id="skewToggle" onchange="applyToSelected()">

<h3>Curved Text</h3>
<select id="curveType" onchange="renderText()">
  <option value="none">Straight</option>
  <option value="arc">Arc</option>
  <option value="circle">Circle</option>
</select>

<label>Radius</label>
<input type="range" min="100" max="500" value="250" id="radius" oninput="renderText()">

<h3>Background</h3>
<input type="color" id="bgColor" value="#111111" onchange="updateBackground()">

<h3>Animation</h3>
<button onclick="toggleAnimation()">Toggle Pulse</button>

<h3>Export</h3>
<button onclick="exportImage('png')">PNG</button>
<button onclick="exportImage('jpeg')">JPEG</button>
<button onclick="exportImage('webp')">WebP</button>
<button onclick="copyClipboard()">Copy</button>

</div>

<div class="preview-area">
  <div id="renderBox"></div>
</div>

</main>

<script>
let selectedWord = null;
let animated = false;

function renderText() {
  const box = document.getElementById("renderBox");
  box.innerHTML = "";
  box.style.fontFamily = fontSelect.value;
  box.style.fontSize = fontSize.value + "px";
  box.style.setProperty("--strokeWidth", strokeWidth.value + "px");

  const words = textInput.value.split(/\s+/);

  if (curveType.value === "none") {
    words.forEach(w => {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = w + " ";
      span.onclick = () => selectWord(span);
      box.appendChild(span);
    });
  } else {
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    const path = document.createElementNS(svg.namespaceURI,"path");
    const r = radius.value;
    path.setAttribute("id","curvePath");

    if (curveType.value === "arc")
      path.setAttribute("d",`M 0 ${r} A ${r} ${r} 0 0 1 ${r*2} ${r}`);
    else
      path.setAttribute("d",`M ${r} ${r} m -${r},0 a ${r},${r} 0 1,1 ${r*2},0 a ${r},${r} 0 1,1 -${r*2},0`);

    const text = document.createElementNS(svg.namespaceURI,"text");
    const textPath = document.createElementNS(svg.namespaceURI,"textPath");
    textPath.setAttributeNS("http://www.w3.org/1999/xlink","href","#curvePath");
    textPath.textContent = textInput.value;

    text.appendChild(textPath);
    svg.appendChild(path);
    svg.appendChild(text);
    box.appendChild(svg);
  }
}

function selectWord(el) {
  document.querySelectorAll(".word").forEach(w=>w.classList.remove("selected"));
  el.classList.add("selected");
  selectedWord = el;
}

function applyToSelected() {
  if (!selectedWord) return;
  selectedWord.style.color = textColor.value;
  selectedWord.classList.toggle("glow", glowToggle.checked);
  selectedWord.classList.toggle("skew", skewToggle.checked);
}

function updateStyle() {
  renderText();
}

function updateBackground() {
  renderBox.style.background = bgColor.value;
}

function toggleAnimation() {
  animated = !animated;
  renderBox.classList.toggle("anim-pulse", animated);
}

function exportImage(type) {
  domtoimage.toBlob(renderBox, {scale: 2})
    .then(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "text-image."+type;
      a.click();
    });
}

function copyClipboard() {
  domtoimage.toBlob(renderBox).then(blob => {
    navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
  });
}

renderText();
</script>

</body>
</html>
