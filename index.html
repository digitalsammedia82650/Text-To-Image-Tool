<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>Text To Image Studio Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&family=Playfair+Display:wght@700&family=Fira+Code&family=Bungee&display=swap" rel="stylesheet">

<style>

/* =========================================================
ROOT
========================================================= */

:root{
    --bg:#020617;
    --panel:#0f172a;
    --panel2:#111827;
    --border:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#6366f1;
    --primary-hover:#4f46e5;
}

/* =========================================================
GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

::-webkit-scrollbar{
    width:10px;
    height:10px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

/* =========================================================
APP
========================================================= */

.app{
    display:flex;
    flex-direction:column;
    height:100%;
}

/* =========================================================
HEADER
========================================================= */

header{
    height:70px;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(2,6,23,.95);
    border-bottom:1px solid var(--border);
    z-index:100;
}

.logo{
    font-size:1.3rem;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--primary);
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================================================
BUTTONS
========================================================= */

.btn{
    border:none;
    cursor:pointer;
    background:#1e293b;
    color:white;
    padding:10px 14px;
    border-radius:14px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    background:#334155;
}

.btn.active{
    background:var(--primary);
}

.btn-primary{
    background:var(--primary);
}

.btn-primary:hover{
    background:var(--primary-hover);
}

/* =========================================================
MAIN
========================================================= */

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* =========================================================
SIDEBAR
========================================================= */

.sidebar{
    width:390px;
    overflow-y:auto;
    background:var(--panel);
    border-right:1px solid var(--border);
}

.panel{
    padding:18px;
    border-bottom:1px solid var(--border);
}

.panel-title{
    font-size:12px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:15px;
    letter-spacing:1px;
    font-weight:800;
}

.group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.input,
.select{
    width:100%;
    border:none;
    outline:none;
    background:#020617;
    border:1px solid #1e293b;
    color:white;
    border-radius:14px;
    padding:12px;
}

.range{
    width:100%;
}

label{
    font-size:12px;
    color:#cbd5e1;
    display:block;
    margin-bottom:8px;
}

/* =========================================================
EDITOR
========================================================= */

#editor{
    min-height:260px;
    border-radius:18px;
    border:1px solid #1e293b;
    background:#020617;
    padding:18px;
    outline:none;
    line-height:1.6;
    font-size:18px;
}

/* =========================================================
WORKSPACE
========================================================= */

.workspace{
    flex:1;
    overflow:auto;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px;
    background:
    radial-gradient(#1e293b 1px, transparent 1px);
    background-size:20px 20px;
}

/* =========================================================
CANVAS
========================================================= */

.canvas-wrap{
    position:relative;
    transition:.2s;
}

#svgCanvas{
    display:block;
    border-radius:30px;
    overflow:hidden;
    background:#111;
    box-shadow:
    0 25px 60px rgba(0,0,0,.6);
}

/* =========================================================
MOBILE
========================================================= */

.mobile-nav{
    display:none;
}

@media(max-width:900px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        display:none;
        height:calc(100vh - 120px);
    }

    .workspace{
        display:none;
    }

    .sidebar.active{
        display:block;
    }

    .workspace.active{
        display:flex;
    }

    .mobile-nav{
        display:flex;
        justify-content:space-around;
        padding:10px;
        border-top:1px solid var(--border);
        background:#0f172a;
    }

    .mobile-nav button{
        border:none;
        background:none;
        color:#94a3b8;
        font-weight:700;
    }

    .mobile-nav button.active{
        color:var(--primary);
    }

}

</style>
</head>
<body>

<div class="app">

<header>

<div class="logo">
SVG<span>.</span>Studio
</div>

<div class="header-actions">

<button class="btn" onclick="resetStudio()">
Reset
</button>

<button class="btn" onclick="downloadSVG()">
SVG
</button>

<button class="btn" onclick="exportImage('jpg')">
JPG
</button>

<button class="btn btn-primary" onclick="exportImage('png')">
PNG
</button>

</div>

</header>

<div class="main">

<!-- =========================================================
SIDEBAR
========================================================= -->

<aside class="sidebar active" id="sidebar">

<!-- =========================================================
CONTENT
========================================================= -->

<div class="panel">

<div class="panel-title">
Content
</div>

<div class="group" style="margin-bottom:15px;">

<button class="btn" onclick="execCmd('bold')"><b>B</b></button>

<button class="btn" onclick="execCmd('italic')"><i>I</i></button>

<button class="btn" onclick="execCmd('underline')"><u>U</u></button>

<button class="btn" onclick="execCmd('insertUnorderedList')">
List
</button>

<button class="btn" onclick="setAlign('left')">
Left
</button>

<button class="btn" onclick="setAlign('center')">
Center
</button>

<button class="btn" onclick="setAlign('right')">
Right
</button>

</div>

<div
id="editor"
contenteditable="true"
oninput="syncEditor()">

<h1>SVG Text Studio</h1>

<p>
Create beautiful text-based full-page images with SVG rendering.
</p>

<ul>
<li>Modern typography</li>
<li>Gradient text</li>
<li>Paper sizes</li>
<li>Background image controls</li>
<li>Retina PNG export</li>
</ul>

</div>

</div>

<!-- =========================================================
TYPOGRAPHY
========================================================= -->

<div class="panel">

<div class="panel-title">
Typography
</div>

<label>
Font Family
</label>

<select class="select" onchange="changeFont(this.value)">

<option value="Inter">
Inter
</option>

<option value="Playfair Display">
Playfair
</option>

<option value="Fira Code">
Fira Code
</option>

<option value="Bungee">
Bungee
</option>

</select>

<br><br>

<div class="group">

<div style="flex:1;">

<label>
Text Color
</label>

<input
type="color"
class="input"
value="#ffffff"
oninput="changeTextColor(this.value)"
>

</div>

<div style="flex:1;">

<label>
Background
</label>

<input
type="color"
class="input"
value="#111111"
oninput="changeBackground(this.value)"
>

</div>

</div>

<br>

<div class="group">

<div style="flex:1;">

<label>
Gradient 1
</label>

<input
type="color"
class="input"
id="grad1"
value="#6366f1"
>

</div>

<div style="flex:1;">

<label>
Gradient 2
</label>

<input
type="color"
class="input"
id="grad2"
value="#ec4899"
>

</div>

</div>

<br>

<div class="group">

<button class="btn" onclick="applyGradientText()">
Gradient Text
</button>

<button class="btn" onclick="applyGradientBackground()">
Gradient BG
</button>

<button class="btn" onclick="toggleGlow()">
Glow
</button>

</div>

<br><br>

<label>
Font Size
</label>

<input
type="range"
class="range"
min="18"
max="120"
value="48"
oninput="changeFontSize(this.value)"
>

<br><br>

<label>
Line Height
</label>

<input
type="range"
class="range"
min="1"
max="3"
step="0.1"
value="1.5"
oninput="changeLineHeight(this.value)"
>

<br><br>

<label>
Letter Spacing
</label>

<input
type="range"
class="range"
min="0"
max="20"
value="0"
oninput="changeLetterSpacing(this.value)"
>

</div>

<!-- =========================================================
BACKGROUND
========================================================= -->

<div class="panel">

<div class="panel-title">
Background Image
</div>

<button
class="btn"
style="width:100%;"
onclick="document.getElementById('bgUpload').click()">
Upload Background
</button>

<input
type="file"
id="bgUpload"
hidden
accept="image/*"
onchange="uploadBackground(this)"
>

<br><br>

<label>
Image Fit
</label>

<select class="select" onchange="setBgFit(this.value)">

<option value="cover">
Cover
</option>

<option value="contain">
Contain
</option>

<option value="stretch">
Stretch
</option>

</select>

<br><br>

<label>
Background Opacity
</label>

<input
type="range"
class="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="setBgOpacity(this.value)"
>

<br><br>

<label>
Overlay Color
</label>

<input
type="color"
class="input"
value="#000000"
oninput="setOverlayColor(this.value)"
>

<br><br>

<label>
Overlay Strength
</label>

<input
type="range"
class="range"
min="0"
max="1"
step="0.01"
value="0"
oninput="setOverlayOpacity(this.value)"
>

</div>

<!-- =========================================================
CANVAS
========================================================= -->

<div class="panel">

<div class="panel-title">
Canvas
</div>

<div class="group">

<button class="btn active" onclick="setPaper(2480,3508,this)">
A4
</button>

<button class="btn" onclick="setPaper(3508,4961,this)">
A3
</button>

<button class="btn" onclick="setPaper(1748,2480,this)">
A5
</button>

<button class="btn" onclick="setPaper(1080,1080,this)">
1:1
</button>

<button class="btn" onclick="setPaper(1080,1920,this)">
9:16
</button>

<button class="btn" onclick="setPaper(1920,1080,this)">
16:9
</button>

</div>

<br><br>

<label>
Custom Width
</label>

<input
type="number"
class="input"
id="customWidth"
value="1080"
>

<br><br>

<label>
Custom Height
</label>

<input
type="number"
class="input"
id="customHeight"
value="1920"
>

<br><br>

<button
class="btn"
style="width:100%;"
onclick="applyCustomSize()">
Apply Custom Size
</button>

</div>

</aside>

<!-- =========================================================
WORKSPACE
========================================================= -->

<section class="workspace active" id="workspace">

<div class="canvas-wrap" id="canvasWrap">

<svg
id="svgCanvas"
xmlns="http://www.w3.org/2000/svg"
width="2480"
height="3508"
viewBox="0 0 2480 3508">

<defs>

<linearGradient
id="bgGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#6366f1"/>
<stop offset="100%" stop-color="#ec4899"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="8"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>

</defs>

<!-- BASE -->

<rect
id="svgBg"
width="100%"
height="100%"
fill="#111"
/>

<!-- IMAGE -->

<image
id="bgImage"
width="100%"
height="100%"
preserveAspectRatio="xMidYMid slice"
style="display:none;"
/>

<!-- OVERLAY -->

<rect
id="overlay"
width="100%"
height="100%"
fill="#000"
opacity="0"
/>

<!-- CONTENT -->

<foreignObject
id="foreignObject"
x="120"
y="120"
width="2240"
height="3200">

<div
xmlns="http://www.w3.org/1999/xhtml"
id="svgContent"
style="
width:100%;
min-height:100%;
font-size:48px;
line-height:1.5;
font-family:Inter,sans-serif;
color:white;
overflow-wrap:anywhere;
word-break:break-word;
white-space:pre-wrap;
">
</div>

</foreignObject>

</svg>

</div>

</section>

</div>

<nav class="mobile-nav">

<button
id="editBtn"
class="active"
onclick="switchMobile('edit')">
Edit
</button>

<button
id="previewBtn"
onclick="switchMobile('preview')">
Preview
</button>

</nav>

</div>

<script>

/* =========================================================
ELEMENTS
========================================================= */

const editor =
document.getElementById('editor');

const svgContent =
document.getElementById('svgContent');

const svgCanvas =
document.getElementById('svgCanvas');

const foreignObject =
document.getElementById('foreignObject');

const bgImage =
document.getElementById('bgImage');

/* =========================================================
SYNC
========================================================= */

function syncEditor(){

    svgContent.innerHTML =
    editor.innerHTML;

    autoResize();

    localStorage.setItem(
        'studioData',
        editor.innerHTML
    );

}

/* =========================================================
AUTO HEIGHT
========================================================= */

function autoResize(){

    setTimeout(()=>{

        const h =
        svgContent.scrollHeight + 260;

        const w =
        svgCanvas.viewBox.baseVal.width;

        svgCanvas.setAttribute(
            'height',
            h
        );

        svgCanvas.setAttribute(
            'viewBox',
            `0 0 ${w} ${h}`
        );

        foreignObject.setAttribute(
            'height',
            h - 240
        );

    },50);

}

/* =========================================================
TEXT COMMANDS
========================================================= */

function execCmd(cmd){

    document.execCommand(
        cmd,
        false,
        null
    );

    syncEditor();

}

function setAlign(v){

    svgContent.style.textAlign=v;

}

function changeFont(v){

    svgContent.style.fontFamily=v;

}

function changeTextColor(v){

    svgContent.style.color=v;

    svgContent.style.webkitTextFillColor=v;

}

function changeFontSize(v){

    svgContent.style.fontSize =
    v + 'px';

    autoResize();

}

function changeLineHeight(v){

    svgContent.style.lineHeight=v;

    autoResize();

}

function changeLetterSpacing(v){

    svgContent.style.letterSpacing =
    v + 'px';

}

/* =========================================================
BACKGROUND
========================================================= */

function changeBackground(v){

    document
    .getElementById('svgBg')
    .setAttribute(
        'fill',
        v
    );

}

function applyGradientBackground(){

    const c1 =
    document.getElementById('grad1').value;

    const c2 =
    document.getElementById('grad2').value;

    const stops =
    document
    .querySelectorAll('#bgGradient stop');

    stops[0].setAttribute(
        'stop-color',
        c1
    );

    stops[1].setAttribute(
        'stop-color',
        c2
    );

    document
    .getElementById('svgBg')
    .setAttribute(
        'fill',
        'url(#bgGradient)'
    );

}

function applyGradientText(){

    const c1 =
    document.getElementById('grad1').value;

    const c2 =
    document.getElementById('grad2').value;

    svgContent.style.background =
    `linear-gradient(90deg,${c1},${c2})`;

    svgContent.style.webkitBackgroundClip =
    'text';

    svgContent.style.webkitTextFillColor =
    'transparent';

}

/* =========================================================
GLOW
========================================================= */

let glow=false;

function toggleGlow(){

    glow=!glow;

    svgContent.style.filter =
    glow
    ? 'url(#glow)'
    : 'none';

}

/* =========================================================
UPLOAD BACKGROUND
========================================================= */

function uploadBackground(input){

    const file =
    input.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload=e=>{

        bgImage.setAttribute(
            'href',
            e.target.result
        );

        bgImage.style.display='block';

    };

    reader.readAsDataURL(file);

}

/* =========================================================
BACKGROUND FIT
========================================================= */

function setBgFit(mode){

    if(mode==='cover'){

        bgImage.setAttribute(
            'preserveAspectRatio',
            'xMidYMid slice'
        );

    }

    if(mode==='contain'){

        bgImage.setAttribute(
            'preserveAspectRatio',
            'xMidYMid meet'
        );

    }

    if(mode==='stretch'){

        bgImage.setAttribute(
            'preserveAspectRatio',
            'none'
        );

    }

}

/* =========================================================
BACKGROUND OPACITY
========================================================= */

function setBgOpacity(v){

    bgImage.setAttribute(
        'opacity',
        v
    );

}

/* =========================================================
OVERLAY
========================================================= */

function setOverlayColor(v){

    document
    .getElementById('overlay')
    .setAttribute(
        'fill',
        v
    );

}

function setOverlayOpacity(v){

    document
    .getElementById('overlay')
    .setAttribute(
        'opacity',
        v
    );

}

/* =========================================================
CANVAS
========================================================= */

function setPaper(w,h,btn){

    document
    .querySelectorAll('.group .btn')
    .forEach(b=>b.classList.remove('active'));

    btn.classList.add('active');

    applySize(w,h);

}

function applyCustomSize(){

    const w =
    parseInt(
        document.getElementById(
            'customWidth'
        ).value
    );

    const h =
    parseInt(
        document.getElementById(
            'customHeight'
        ).value
    );

    applySize(w,h);

}

function applySize(w,h){

    svgCanvas.setAttribute(
        'width',
        w
    );

    svgCanvas.setAttribute(
        'height',
        h
    );

    svgCanvas.setAttribute(
        'viewBox',
        `0 0 ${w} ${h}`
    );

    foreignObject.setAttribute(
        'width',
        w - 240
    );

    foreignObject.setAttribute(
        'height',
        h - 240
    );

    autoResize();

}

/* =========================================================
EXPORT
========================================================= */

function exportImage(type='png'){

    const serializer =
    new XMLSerializer();

    const source =
    serializer.serializeToString(
        svgCanvas
    );

    const blob =
    new Blob(
        [source],
        {
            type:'image/svg+xml;charset=utf-8'
        }
    );

    const url =
    URL.createObjectURL(blob);

    const img =
    new Image();

    img.onload=()=>{

        const w =
        svgCanvas.viewBox.baseVal.width;

        const h =
        svgCanvas.viewBox.baseVal.height;

        const canvas =
        document.createElement('canvas');

        canvas.width=w*2;

        canvas.height=h*2;

        const ctx =
        canvas.getContext('2d');

        ctx.scale(2,2);

        ctx.drawImage(img,0,0);

        URL.revokeObjectURL(url);

        canvas.toBlob(blob=>{

            const a =
            document.createElement('a');

            a.href =
            URL.createObjectURL(blob);

            a.download =
            'SVG-Studio-' +
            Date.now() +
            '.' + type;

            a.click();

        },
        type==='jpg'
        ? 'image/jpeg'
        : 'image/png',
        .95);

    };

    img.src=url;

}

/* =========================================================
SVG DOWNLOAD
========================================================= */

function downloadSVG(){

    const serializer =
    new XMLSerializer();

    const source =
    serializer.serializeToString(
        svgCanvas
    );

    const blob =
    new Blob(
        [source],
        {
            type:'image/svg+xml'
        }
    );

    const a =
    document.createElement('a');

    a.href =
    URL.createObjectURL(blob);

    a.download =
    'SVG-Studio.svg';

    a.click();

}

/* =========================================================
RESET
========================================================= */

function resetStudio(){

    localStorage.clear();

    location.reload();

}

/* =========================================================
MOBILE
========================================================= */

function switchMobile(mode){

    const sidebar =
    document.getElementById('sidebar');

    const workspace =
    document.getElementById('workspace');

    const eb =
    document.getElementById('editBtn');

    const pb =
    document.getElementById('previewBtn');

    if(mode==='edit'){

        sidebar.classList.add('active');

        workspace.classList.remove('active');

        eb.classList.add('active');

        pb.classList.remove('active');

    }else{

        sidebar.classList.remove('active');

        workspace.classList.add('active');

        eb.classList.remove('active');

        pb.classList.add('active');

    }

}

/* =========================================================
SHORTCUTS
========================================================= */

document.addEventListener(
'keydown',
e=>{

    if(e.ctrlKey || e.metaKey){

        if(e.key==='b'){

            e.preventDefault();

            execCmd('bold');

        }

        if(e.key==='i'){

            e.preventDefault();

            execCmd('italic');

        }

    }

});

/* =========================================================
INIT
========================================================= */

window.onload=()=>{

    const saved =
    localStorage.getItem(
        'studioData'
    );

    if(saved){

        editor.innerHTML=saved;

    }

    syncEditor();

};

</script>

</body>
</html>
