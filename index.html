<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>SVG Canva Style Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700&family=Fira+Code&family=Bungee&display=swap" rel="stylesheet">

<style>

/* =========================================================
ROOT
========================================================= */

:root{
    --bg:#0b1120;
    --panel:#111827;
    --panel2:#1e293b;
    --border:#243041;
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#6366f1;
    --hover:#4f46e5;
}

/* =========================================================
GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:Inter,sans-serif;
    color:white;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

::-webkit-scrollbar{
    width:10px;
    height:10px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

/* =========================================================
APP
========================================================= */

.app{
    display:flex;
    flex-direction:column;
    height:100%;
}

/* =========================================================
HEADER
========================================================= */

header{
    height:70px;
    background:rgba(2,6,23,.95);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:100;
}

.logo{
    font-size:1.3rem;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--primary);
}

.header-actions{
    display:flex;
    gap:10px;
}

/* =========================================================
BUTTONS
========================================================= */

.btn{
    border:none;
    cursor:pointer;
    border-radius:14px;
    padding:11px 16px;
    font-weight:700;
    transition:.2s;
    background:#1e293b;
    color:white;
}

.btn:hover{
    background:#334155;
}

.btn-primary{
    background:var(--primary);
}

.btn-primary:hover{
    background:var(--hover);
}

.btn.active{
    background:var(--primary);
}

/* =========================================================
LAYOUT
========================================================= */

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* =========================================================
SIDEBAR
========================================================= */

.sidebar{
    width:380px;
    background:var(--panel);
    overflow-y:auto;
    border-right:1px solid var(--border);
}

.section{
    padding:20px;
    border-bottom:1px solid var(--border);
}

.section-title{
    font-size:12px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:16px;
    font-weight:800;
    letter-spacing:1px;
}

.group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.input,
.select{
    width:100%;
    border:none;
    outline:none;
    border-radius:14px;
    background:#020617;
    color:white;
    border:1px solid #1e293b;
    padding:12px;
}

.range{
    width:100%;
}

label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:13px;
}

/* =========================================================
EDITOR
========================================================= */

#editor{
    min-height:240px;
    background:#020617;
    border:1px solid #1e293b;
    border-radius:20px;
    padding:18px;
    outline:none;
    line-height:1.6;
    font-size:20px;
}

/* =========================================================
WORKSPACE
========================================================= */

.workspace{
    flex:1;
    overflow:auto;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px;
    background:
    radial-gradient(#1e293b 1px, transparent 1px);
    background-size:20px 20px;
}

/* =========================================================
CANVAS
========================================================= */

.canvas-wrap{
    position:relative;
    border-radius:28px;
    overflow:hidden;
    box-shadow:
    0 25px 70px rgba(0,0,0,.55);
}

#svgCanvas{
    display:block;
    background:#111;
}

/* =========================================================
MOBILE
========================================================= */

.mobile-nav{
    display:none;
}

@media(max-width:900px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        display:none;
        height:calc(100vh - 120px);
    }

    .workspace{
        display:none;
    }

    .sidebar.active{
        display:block;
    }

    .workspace.active{
        display:flex;
    }

    .mobile-nav{
        display:flex;
        justify-content:space-around;
        padding:10px;
        background:#111827;
        border-top:1px solid var(--border);
    }

    .mobile-nav button{
        border:none;
        background:none;
        color:#94a3b8;
        font-weight:700;
    }

    .mobile-nav button.active{
        color:var(--primary);
    }

}

</style>
</head>
<body>

<div class="app">

<header>

<div class="logo">
SVG<span>.</span>Studio
</div>

<div class="header-actions">

<button class="btn" onclick="resetStudio()">
Reset
</button>

<button class="btn" onclick="downloadSVG()">
SVG
</button>

<button class="btn" onclick="exportImage('jpg')">
JPG
</button>

<button class="btn btn-primary" onclick="exportImage('png')">
PNG
</button>

</div>

</header>

<div class="main">

<!-- =========================================================
SIDEBAR
========================================================= -->

<aside class="sidebar active" id="sidebar">

<!-- =========================================================
TEXT
========================================================= -->

<div class="section">

<div class="section-title">
Text
</div>

<div class="group" style="margin-bottom:14px;">

<button class="btn" onclick="cmd('bold')">
B
</button>

<button class="btn" onclick="cmd('italic')">
I
</button>

<button class="btn" onclick="cmd('underline')">
U
</button>

<button class="btn" onclick="cmd('insertUnorderedList')">
List
</button>

<button class="btn" onclick="alignText('left')">
Left
</button>

<button class="btn" onclick="alignText('center')">
Center
</button>

<button class="btn" onclick="alignText('right')">
Right
</button>

</div>

<div
id="editor"
contenteditable="true"
oninput="syncEditor()">

<h1>SVG Canva Style Studio</h1>

<p>
Create modern text based full page image posters.
</p>

<ul>
<li>SVG powered rendering</li>
<li>Editable backgrounds</li>
<li>Gradient text</li>
<li>Paper sizes</li>
<li>Ultra HD export</li>
</ul>

</div>

</div>

<!-- =========================================================
TYPOGRAPHY
========================================================= -->

<div class="section">

<div class="section-title">
Typography
</div>

<label>
Font
</label>

<select class="select" onchange="setFont(this.value)">

<option value="Inter">
Inter
</option>

<option value="Playfair Display">
Playfair
</option>

<option value="Fira Code">
Fira Code
</option>

<option value="Bungee">
Bungee
</option>

</select>

<br><br>

<label>
Text Style
</label>

<select class="select" onchange="setTextMode(this.value)">

<option value="solid">
Solid Color
</option>

<option value="gradient">
Gradient
</option>

</select>

<br><br>

<div id="solidTextOptions">

<label>
Text Color
</label>

<input
type="color"
class="input"
value="#ffffff"
oninput="setTextColor(this.value)"
>

</div>

<div id="gradientTextOptions" style="display:none;">

<label>
Gradient Color 1
</label>

<input
type="color"
class="input"
id="tgrad1"
value="#6366f1"
>

<br><br>

<label>
Gradient Color 2
</label>

<input
type="color"
class="input"
id="tgrad2"
value="#ec4899"
>

<br><br>

<button
class="btn"
style="width:100%;"
onclick="applyTextGradient()">
Apply Gradient
</button>

</div>

<br><br>

<label>
Font Size
</label>

<input
type="range"
class="range"
min="18"
max="120"
value="48"
oninput="setFontSize(this.value)"
>

<br><br>

<label>
Line Height
</label>

<input
type="range"
class="range"
min="1"
max="3"
step="0.1"
value="1.5"
oninput="setLineHeight(this.value)"
>

<br><br>

<label>
Letter Spacing
</label>

<input
type="range"
class="range"
min="0"
max="20"
value="0"
oninput="setLetterSpacing(this.value)"
>

<br><br>

<button
class="btn"
style="width:100%;"
onclick="toggleGlow()">
Toggle Glow
</button>

</div>

<!-- =========================================================
BACKGROUND
========================================================= -->

<div class="section">

<div class="section-title">
Background
</div>

<label>
Background Type
</label>

<select class="select" onchange="setBackgroundMode(this.value)">

<option value="solid">
Solid Color
</option>

<option value="gradient">
Gradient
</option>

<option value="image">
Image
</option>

</select>

<br><br>

<div id="solidBgOptions">

<label>
Background Color
</label>

<input
type="color"
class="input"
value="#111111"
oninput="setBackgroundColor(this.value)"
>

</div>

<div id="gradientBgOptions" style="display:none;">

<label>
Gradient Color 1
</label>

<input
type="color"
class="input"
id="bggrad1"
value="#0f172a"
>

<br><br>

<label>
Gradient Color 2
</label>

<input
type="color"
class="input"
id="bggrad2"
value="#312e81"
>

<br><br>

<button
class="btn"
style="width:100%;"
onclick="applyBackgroundGradient()">
Apply Gradient
</button>

</div>

<div id="imageBgOptions" style="display:none;">

<br>

<button
class="btn"
style="width:100%;"
onclick="document.getElementById('bgUpload').click()">

Upload Background

</button>

<input
type="file"
id="bgUpload"
hidden
accept="image/*"
onchange="uploadBackground(this)"
>

<br><br>

<label>
Zoom
</label>

<input
type="range"
class="range"
min="0.5"
max="3"
step="0.01"
value="1"
oninput="setBgScale(this.value)"
>

<br><br>

<label>
Position X
</label>

<input
type="range"
class="range"
min="-1000"
max="1000"
value="0"
oninput="setBgX(this.value)"
>

<br><br>

<label>
Position Y
</label>

<input
type="range"
class="range"
min="-1000"
max="1000"
value="0"
oninput="setBgY(this.value)"
>

<br><br>

<label>
Rotation
</label>

<input
type="range"
class="range"
min="-180"
max="180"
value="0"
oninput="setBgRotate(this.value)"
>

<br><br>

<label>
Opacity
</label>

<input
type="range"
class="range"
min="0"
max="1"
step="0.01"
value="1"
oninput="setBgOpacity(this.value)"
>

</div>

</div>

<!-- =========================================================
CANVAS
========================================================= -->

<div class="section">

<div class="section-title">
Canvas
</div>

<div class="group">

<button class="btn active" onclick="setCanvas(2480,3508,this)">
A4
</button>

<button class="btn" onclick="setCanvas(3508,4961,this)">
A3
</button>

<button class="btn" onclick="setCanvas(1748,2480,this)">
A5
</button>

<button class="btn" onclick="setCanvas(1080,1080,this)">
1:1
</button>

<button class="btn" onclick="setCanvas(1080,1920,this)">
Story
</button>

<button class="btn" onclick="setCanvas(1920,1080,this)">
16:9
</button>

</div>

<br><br>

<label>
Custom Width
</label>

<input
type="number"
class="input"
id="cw"
value="1080"
>

<br><br>

<label>
Custom Height
</label>

<input
type="number"
class="input"
id="ch"
value="1920"
>

<br><br>

<button
class="btn"
style="width:100%;"
onclick="applyCustomCanvas()">

Apply Custom Size

</button>

</div>

</aside>

<!-- =========================================================
WORKSPACE
========================================================= -->

<section class="workspace active" id="workspace">

<div class="canvas-wrap">

<svg
id="svgCanvas"
xmlns="http://www.w3.org/2000/svg"
width="1080"
height="1920"
viewBox="0 0 1080 1920">

<defs>

<linearGradient
id="bgGradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#312e81"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="10"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

<!-- BASE -->

<rect
id="bgRect"
width="100%"
height="100%"
fill="#111"
/>

<!-- SVG IMAGE LAYER -->

<g id="bgGroup">

<image
id="bgImage"
width="1080"
height="1920"
preserveAspectRatio="xMidYMid slice"
style="display:none;"
/>

</g>

<!-- CONTENT -->

<foreignObject
id="foreignObject"
x="80"
y="80"
width="920"
height="1760">

<div
xmlns="http://www.w3.org/1999/xhtml"
id="svgContent"
style="
width:100%;
min-height:100%;
font-size:48px;
line-height:1.5;
font-family:Inter,sans-serif;
color:white;
overflow-wrap:anywhere;
word-break:break-word;
">

</div>

</foreignObject>

</svg>

</div>

</section>

</div>

<!-- =========================================================
MOBILE NAV
========================================================= -->

<nav class="mobile-nav">

<button
id="editBtn"
class="active"
onclick="switchMobile('edit')">

Edit

</button>

<button
id="previewBtn"
onclick="switchMobile('preview')">

Preview

</button>

</nav>

</div>

<script>

/* =========================================================
ELEMENTS
========================================================= */

const editor=document.getElementById('editor');
const svgContent=document.getElementById('svgContent');
const svgCanvas=document.getElementById('svgCanvas');
const bgImage=document.getElementById('bgImage');
const bgGroup=document.getElementById('bgGroup');

let bgScale=1;
let bgX=0;
let bgY=0;
let bgRotate=0;

/* =========================================================
SYNC
========================================================= */

function syncEditor(){

    svgContent.innerHTML=editor.innerHTML;

    autoResize();

}

/* =========================================================
AUTO RESIZE
========================================================= */

function autoResize(){

    setTimeout(()=>{

        const h=svgContent.scrollHeight+200;

        document
        .getElementById('foreignObject')
        .setAttribute('height',h);

    },50);

}

/* =========================================================
COMMANDS
========================================================= */

function cmd(c){

    document.execCommand(c,false,null);

    syncEditor();

}

function alignText(v){

    svgContent.style.textAlign=v;

}

/* =========================================================
TYPOGRAPHY
========================================================= */

function setFont(v){

    svgContent.style.fontFamily=v;

}

function setTextMode(v){

    document.getElementById('solidTextOptions').style.display=
    v==='solid' ? 'block':'none';

    document.getElementById('gradientTextOptions').style.display=
    v==='gradient' ? 'block':'none';

}

function setTextColor(v){

    svgContent.style.background='none';

    svgContent.style.color=v;

    svgContent.style.webkitTextFillColor=v;

}

function applyTextGradient(){

    const c1=document.getElementById('tgrad1').value;
    const c2=document.getElementById('tgrad2').value;

    svgContent.style.background=
    `linear-gradient(90deg,${c1},${c2})`;

    svgContent.style.webkitBackgroundClip='text';
    svgContent.style.webkitTextFillColor='transparent';

}

function setFontSize(v){

    svgContent.style.fontSize=v+'px';

    autoResize();

}

function setLineHeight(v){

    svgContent.style.lineHeight=v;

}

function setLetterSpacing(v){

    svgContent.style.letterSpacing=v+'px';

}

let glow=false;

function toggleGlow(){

    glow=!glow;

    svgContent.style.filter=
    glow ? 'url(#glow)' : 'none';

}

/* =========================================================
BACKGROUND
========================================================= */

function setBackgroundMode(v){

    document.getElementById('solidBgOptions').style.display=
    v==='solid' ? 'block':'none';

    document.getElementById('gradientBgOptions').style.display=
    v==='gradient' ? 'block':'none';

    document.getElementById('imageBgOptions').style.display=
    v==='image' ? 'block':'none';

}

function setBackgroundColor(v){

    document
    .getElementById('bgRect')
    .setAttribute('fill',v);

}

function applyBackgroundGradient(){

    const c1=document.getElementById('bggrad1').value;
    const c2=document.getElementById('bggrad2').value;

    const stops=document.querySelectorAll('#bgGradient stop');

    stops[0].setAttribute('stop-color',c1);
    stops[1].setAttribute('stop-color',c2);

    document
    .getElementById('bgRect')
    .setAttribute('fill','url(#bgGradient)');

}

/* =========================================================
UPLOAD BG
========================================================= */

function uploadBackground(input){

    const file=input.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=e=>{

        bgImage.setAttribute(
            'href',
            e.target.result
        );

        bgImage.style.display='block';

    };

    reader.readAsDataURL(file);

}

/* =========================================================
SVG IMAGE TRANSFORM
========================================================= */

function updateBgTransform(){

    bgGroup.setAttribute(
        'transform',
        `
        translate(${bgX} ${bgY})
        scale(${bgScale})
        rotate(${bgRotate} 540 960)
        `
    );

}

function setBgScale(v){

    bgScale=v;

    updateBgTransform();

}

function setBgX(v){

    bgX=v;

    updateBgTransform();

}

function setBgY(v){

    bgY=v;

    updateBgTransform();

}

function setBgRotate(v){

    bgRotate=v;

    updateBgTransform();

}

function setBgOpacity(v){

    bgImage.setAttribute('opacity',v);

}

/* =========================================================
CANVAS
========================================================= */

function setCanvas(w,h,btn){

    document
    .querySelectorAll('.group .btn')
    .forEach(b=>b.classList.remove('active'));

    btn.classList.add('active');

    applyCanvas(w,h);

}

function applyCustomCanvas(){

    const w=parseInt(document.getElementById('cw').value);
    const h=parseInt(document.getElementById('ch').value);

    applyCanvas(w,h);

}

function applyCanvas(w,h){

    svgCanvas.setAttribute('width',w);
    svgCanvas.setAttribute('height',h);
    svgCanvas.setAttribute('viewBox',`0 0 ${w} ${h}`);

    bgImage.setAttribute('width',w);
    bgImage.setAttribute('height',h);

}

/* =========================================================
EXPORT
========================================================= */

function exportImage(type='png'){

    const serializer=new XMLSerializer();

    const source=
    serializer.serializeToString(svgCanvas);

    const blob=
    new Blob(
        [source],
        {type:'image/svg+xml;charset=utf-8'}
    );

    const url=URL.createObjectURL(blob);

    const img=new Image();

    img.onload=()=>{

        const canvas=document.createElement('canvas');

        canvas.width=
        svgCanvas.viewBox.baseVal.width*2;

        canvas.height=
        svgCanvas.viewBox.baseVal.height*2;

        const ctx=canvas.getContext('2d');

        ctx.scale(2,2);

        ctx.drawImage(img,0,0);

        canvas.toBlob(blob=>{

            const a=document.createElement('a');

            a.href=URL.createObjectURL(blob);

            a.download=
            'SVG-Studio-'+Date.now()+'.'+type;

            a.click();

        },
        type==='jpg'
        ? 'image/jpeg'
        : 'image/png',
        .95);

    };

    img.src=url;

}

/* =========================================================
SVG DOWNLOAD
========================================================= */

function downloadSVG(){

    const serializer=new XMLSerializer();

    const source=
    serializer.serializeToString(svgCanvas);

    const blob=
    new Blob(
        [source],
        {type:'image/svg+xml'}
    );

    const a=document.createElement('a');

    a.href=URL.createObjectURL(blob);

    a.download='SVG-Studio.svg';

    a.click();

}

/* =========================================================
RESET
========================================================= */

function resetStudio(){

    location.reload();

}

/* =========================================================
MOBILE
========================================================= */

function switchMobile(mode){

    const sidebar=document.getElementById('sidebar');
    const workspace=document.getElementById('workspace');

    const eb=document.getElementById('editBtn');
    const pb=document.getElementById('previewBtn');

    if(mode==='edit'){

        sidebar.classList.add('active');
        workspace.classList.remove('active');

        eb.classList.add('active');
        pb.classList.remove('active');

    }else{

        sidebar.classList.remove('active');
        workspace.classList.add('active');

        eb.classList.remove('active');
        pb.classList.add('active');

    }

}

/* =========================================================
INIT
========================================================= */

window.onload=()=>{

    syncEditor();

};

</script>

</body>
</html>
