<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text → Image Studio (Word-Style Editor)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..900&family=Poppins:wght@300..800&display=swap" rel="stylesheet">

<!-- Export -->
<script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0b0f24;
  color:#fff;
}

header{
  padding:12px 16px;
  background:#12163a;
  font-weight:600;
}

main{
  display:grid;
  grid-template-columns:1fr 1fr;
  height:calc(100vh - 50px);
}

/* ===== LEFT: EDITOR ===== */
.editor-panel{
  display:flex;
  flex-direction:column;
  background:#0d1130;
  border-right:1px solid #222;
}

/* Toolbar */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:#151a45;
}

.toolbar button,
.toolbar select,
.toolbar input{
  background:#1e2355;
  color:#fff;
  border:none;
  padding:6px 8px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

/* Editor */
#editor{
  flex:1;
  padding:20px;
  outline:none;
  background:#070a1d;
  font-size:18px;
  line-height:1.6;
  overflow:auto;
}

#editor:empty:before{
  content:"Start typing here like a Word document…";
  color:#666;
}

/* ===== RIGHT: OUTPUT ===== */
.output-panel{
  display:flex;
  flex-direction:column;
  background:#070a18;
}

.output-toolbar{
  padding:10px;
  background:#151a45;
  display:flex;
  gap:10px;
}

.output-toolbar button,
.output-toolbar input{
  background:#4f6bff;
  border:none;
  padding:8px 12px;
  color:#fff;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
}

.preview{
  flex:1;
  padding:24px;
  overflow:auto;
}

#renderBox{
  display:inline-block;
  padding:40px;
  border-radius:16px;
  background:#111;
  min-width:300px;
}

/* Effects */
.glow{
  text-shadow:0 0 10px currentColor,0 0 25px currentColor;
}
</style>
</head>

<body>

<header>Text → Image Tool • Word-Style Editor</header>

<main>

<!-- LEFT: WORD-LIKE INPUT -->
<div class="editor-panel">

  <div class="toolbar">
    <button onclick="cmd('bold')"><b>B</b></button>
    <button onclick="cmd('italic')"><i>I</i></button>
    <button onclick="cmd('underline')"><u>U</u></button>

    <select onchange="cmd('fontName',this.value)">
      <option value="Inter">Inter</option>
      <option value="Poppins">Poppins</option>
      <option value="serif">Serif</option>
    </select>

    <select onchange="cmd('fontSize',this.value)">
      <option value="3">Small</option>
      <option value="4" selected>Normal</option>
      <option value="5">Large</option>
      <option value="6">XL</option>
    </select>

    <input type="color" onchange="cmd('foreColor',this.value)">

    <button onclick="cmd('justifyLeft')">⬅</button>
    <button onclick="cmd('justifyCenter')">⬍</button>
    <button onclick="cmd('justifyRight')">➡</button>
    <button onclick="cmd('justifyFull')">☰</button>

    <button onclick="cmd('insertUnorderedList')">• List</button>
  </div>

  <div id="editor" contenteditable="true"></div>

</div>

<!-- RIGHT: OUTPUT -->
<div class="output-panel">

  <div class="output-toolbar">
    <input type="color" value="#111111" onchange="renderBox.style.background=this.value">
    <button onclick="toggleGlow()">Glow</button>
    <button onclick="exportPNG()">Export PNG</button>
    <button onclick="copyImage()">Copy</button>
  </div>

  <div class="preview">
    <div id="renderBox"></div>
  </div>

</div>

</main>

<script>
const editor=document.getElementById("editor");
const renderBox=document.getElementById("renderBox");

function cmd(command,value=null){
  document.execCommand(command,false,value);
  sync();
}

function sync(){
  renderBox.innerHTML=editor.innerHTML;
}

editor.addEventListener("input",sync);

let glow=false;
function toggleGlow(){
  glow=!glow;
  renderBox.classList.toggle("glow",glow);
}

function exportPNG(){
  domtoimage.toBlob(renderBox,{scale:2}).then(blob=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="text-image.png";
    a.click();
  });
}

function copyImage(){
  domtoimage.toBlob(renderBox).then(blob=>{
    navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
  });
}

sync();
</script>

</body>
</html>
