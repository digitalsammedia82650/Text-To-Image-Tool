<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text → Image / WordArt Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@300..800&family=Montserrat:wght@300..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f1220;
  color: #fff;
}

header {
  padding: 12px 16px;
  background: #15183a;
  font-weight: 600;
}

main {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - 50px);
}

/* LEFT PANEL */
.controls {
  padding: 12px;
  background: #0c0f25;
  overflow-y: auto;
  border-right: 1px solid #222;
}

.controls label {
  font-size: 12px;
  margin-top: 10px;
  display: block;
}

.controls input,
.controls select,
.controls button {
  width: 100%;
  margin-top: 4px;
  padding: 6px;
  border-radius: 6px;
  border: none;
  background: #1a1f45;
  color: #fff;
}

.controls button {
  background: #4f6bff;
  font-weight: 600;
  cursor: pointer;
}

/* EDITOR */
.editor {
  display: flex;
  flex-direction: column;
  height: 100%;
}

#textInput {
  width: 100%;
  height: 150px;
  font-size: 18px;
  padding: 12px;
  border: none;
  outline: none;
  resize: none;
  background: #101433;
  color: #fff;
}

/* PREVIEW */
.preview-area {
  flex: 1;
  overflow: auto;
  padding: 24px;
  background: #080a18;
}

#renderBox {
  display: inline-block;
  padding: 40px;
  border-radius: 16px;
  min-width: 400px;
  background: #111;
  --strokeWidth: 0px;
  --strokeColor: #000;
}

/* WORD STYLING */
.word {
  cursor: pointer;
  padding: 2px 4px;
  color: inherit;
}

.word.selected {
  outline: 2px dashed #4f6bff;
}

/* CORRECT STROKE */
.stroke {
  -webkit-text-stroke-width: var(--strokeWidth);
  -webkit-text-stroke-color: var(--strokeColor);
  paint-order: stroke fill;
}

.glow {
  text-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
}

.skew {
  transform: skew(-12deg);
}

.anim-pulse {
  animation: pulse 1.4s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}
</style>
</head>

<body>

<header>Text → Image • WordArt Studio</header>

<main>

<!-- LEFT CONTROLS -->
<div class="controls">

<label>Font</label>
<select id="fontSelect" onchange="renderText()">
  <option>Inter</option>
  <option>Poppins</option>
  <option>Montserrat</option>
</select>

<label>Font Size</label>
<input type="range" min="16" max="120" value="40" id="fontSize" oninput="renderText()">

<label>Text Color</label>
<input type="color" id="textColor" value="#ffffff" onchange="applyToSelected(true)">

<label>Stroke Width</label>
<input type="range" min="0" max="10" value="0" id="strokeWidth" oninput="applyToSelected()">

<label>Stroke Color</label>
<input type="color" id="strokeColor" value="#000000" onchange="applyToSelected()">

<label><input type="checkbox" id="glowToggle" onchange="applyToSelected()"> Glow</label>
<label><input type="checkbox" id="skewToggle" onchange="applyToSelected()"> Skew</label>

<label>Background</label>
<input type="color" id="bgColor" value="#111111" onchange="updateBackground()">

<button onclick="toggleAnimation()">Toggle Pulse</button>
<button onclick="exportImage()">Export PNG</button>

</div>

<!-- EDITOR + PREVIEW -->
<div class="editor">
<textarea id="textInput" placeholder="Type or paste text here…">Click words to style them individually</textarea>

<div class="preview-area">
  <div id="renderBox"></div>
</div>
</div>

</main>

<script>
let selectedWord = null;

textInput.addEventListener("input", renderText);

function renderText() {
  const box = renderBox;
  box.innerHTML = "";
  box.style.fontFamily = fontSelect.value;
  box.style.fontSize = fontSize.value + "px";
  box.style.color = textColor.value;
  box.style.setProperty("--strokeWidth", strokeWidth.value + "px");
  box.style.setProperty("--strokeColor", strokeColor.value);

  textInput.value.split(/\s+/).forEach(word => {
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = word + " ";
    span.style.color = textColor.value;
    span.onclick = () => selectWord(span);
    box.appendChild(span);
  });
}

function selectWord(el) {
  document.querySelectorAll(".word").forEach(w => w.classList.remove("selected"));
  el.classList.add("selected");
  selectedWord = el;
}

function applyToSelected(applyAll = false) {
  const targets = applyAll
    ? document.querySelectorAll(".word")
    : [selectedWord];

  targets.forEach(w => {
    if (!w) return;

    w.style.color = textColor.value;

    if (strokeWidth.value > 0) {
      w.classList.add("stroke");
      w.style.setProperty("--strokeColor", strokeColor.value);
    } else {
      w.classList.remove("stroke");
    }

    w.classList.toggle("glow", glowToggle.checked);
    w.classList.toggle("skew", skewToggle.checked);
  });
}

function updateBackground() {
  renderBox.style.background = bgColor.value;
}

function toggleAnimation() {
  renderBox.classList.toggle("anim-pulse");
}

function exportImage() {
  domtoimage.toBlob(renderBox, { scale: 2 }).then(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "text-image.png";
    a.click();
  });
}

renderText();
</script>

</body>
</html>
