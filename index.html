<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text → Image WordArt Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..900&family=Poppins:wght@300..800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0b0f24;
  color:#fff;
}

header{
  padding:12px;
  background:#12163a;
  font-weight:600;
}

main{
  display:grid;
  grid-template-columns:360px 1fr;
  height:calc(100vh - 50px);
}

/* CONTROLS */
.controls{
  padding:14px;
  background:#0d1130;
  overflow-y:auto;
}

.controls h3{
  font-size:14px;
  margin-top:16px;
}

.controls label{
  font-size:12px;
  display:block;
  margin-top:10px;
}

.controls select,
.controls input,
.controls button{
  width:100%;
  margin-top:6px;
  padding:6px;
  border:none;
  border-radius:6px;
  background:#1a1f48;
  color:#fff;
}

.controls button{
  background:#4f6bff;
  font-weight:600;
  cursor:pointer;
}

/* EDITOR */
.editor-wrap{
  border:1px solid #333;
  border-radius:10px;
  padding:10px;
  background:#070a1d;
}

#editor{
  min-height:160px;
  outline:none;
  white-space:pre-wrap;
  font-size:18px;
  line-height:1.5;
}

/* PREVIEW */
.preview{
  padding:24px;
  background:#070a18;
  overflow:auto;
}

#renderBox{
  display:inline-block;
  padding:40px;
  border-radius:16px;
  background:#111;
  font-size:42px;
}

/* EFFECTS */
.glow{
  text-shadow:0 0 10px currentColor,0 0 25px currentColor;
}
.stroke{
  -webkit-text-stroke:var(--stroke,2px) currentColor;
}
.anim-pulse{
  animation:pulse 1.5s infinite alternate;
}
@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}
</style>
</head>

<body>

<header>Text → Image • WordArt • Typography Studio</header>

<main>

<div class="controls">

<h3>✍️ Text Input</h3>
<div class="editor-wrap">
  <div id="editor" contenteditable="true">
Type freely here.
Use multiple lines.
Better control = better output.
  </div>
</div>

<h3>🅰 Typography</h3>

<label>Font</label>
<select id="font">
  <option>Inter</option>
  <option>Poppins</option>
</select>

<label>Font Size</label>
<input type="range" min="16" max="120" value="42" id="fontSize">

<label>Line Height</label>
<input type="range" min="1" max="2.5" step="0.1" value="1.4" id="lineHeight">

<label>Letter Spacing</label>
<input type="range" min="0" max="10" value="0" id="letterSpacing">

<label>Text Align</label>
<select id="align">
  <option value="left">Left</option>
  <option value="center">Center</option>
  <option value="right">Right</option>
  <option value="justify">Justify</option>
</select>

<label>Text Color</label>
<input type="color" id="color" value="#ffffff">

<label>Stroke Width</label>
<input type="range" min="0" max="8" value="0" id="stroke">

<label>Glow</label>
<input type="checkbox" id="glow">

<h3>🎞 Animation</h3>
<button onclick="toggleAnim()">Toggle Pulse</button>

<h3>📤 Export</h3>
<button onclick="exportImg()">Export PNG</button>

</div>

<div class="preview">
  <div id="renderBox"></div>
</div>

</main>

<script>
const editor = document.getElementById("editor");
const box = document.getElementById("renderBox");

function render(){
  box.innerHTML = editor.innerHTML;
  box.style.fontFamily = font.value;
  box.style.fontSize = fontSize.value + "px";
  box.style.lineHeight = lineHeight.value;
  box.style.letterSpacing = letterSpacing.value + "px";
  box.style.textAlign = align.value;
  box.style.color = color.value;
  box.style.setProperty("--stroke", stroke.value + "px");

  box.classList.toggle("glow", glow.checked);
}

editor.addEventListener("input", render);
document.querySelectorAll("input,select").forEach(el=>{
  el.addEventListener("input", render);
});

let anim=false;
function toggleAnim(){
  anim=!anim;
  box.classList.toggle("anim-pulse",anim);
}

function exportImg(){
  domtoimage.toBlob(box,{scale:2}).then(blob=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="text-image.png";
    a.click();
  });
}

render();
</script>

</body>
</html>
