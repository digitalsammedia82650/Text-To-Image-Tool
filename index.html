<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Text To Image Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;700;800&family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&family=Oswald:wght@400;600&family=Bebas+Neue&family=Anton&family=Fira+Code&family=Lobster&family=Pacifico&family=Cinzel:wght@400;700&family=Raleway:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
ROOT
========================================================= */

:root{
    --bg:#eef2ff;
    --panel:#ffffff;
    --border:#dbe4f0;
    --text:#0f172a;
    --muted:#64748b;
    --primary:#7c3aed;
    --primaryHover:#6d28d9;
    --shadow:0 15px 60px rgba(15,23,42,.12);
}

/* =========================================================
GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:Inter,sans-serif;
    color:var(--text);
}

button,
input,
select{
    font-family:inherit;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:30px;
}

/* =========================================================
APP
========================================================= */

.app{
    display:flex;
    flex-direction:column;
    height:100%;
}

/* =========================================================
HEADER
========================================================= */

header{
    height:74px;
    min-height:74px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    z-index:100;
    gap:10px;
}

.logo{
    font-size:1.4rem;
    font-weight:900;
    letter-spacing:-1px;
    white-space:nowrap;
}

.logo span{
    color:var(--primary);
}

.header-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

/* =========================================================
BUTTONS
========================================================= */

.btn{
    border:none;
    border-radius:14px;
    padding:11px 15px;
    cursor:pointer;
    transition:.2s;
    font-weight:700;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primaryHover);
}

.btn-light{
    background:#eef2ff;
    color:#312e81;
}

.btn-dark{
    background:#0f172a;
    color:white;
}

/* =========================================================
MAIN
========================================================= */

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* =========================================================
SIDEBAR
========================================================= */

.sidebar{
    width:390px;
    background:white;
    border-right:1px solid var(--border);
    overflow-y:auto;
}

.section{
    padding:22px;
    border-bottom:1px solid var(--border);
}

.section-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    font-weight:900;
    margin-bottom:16px;
}

.group{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.input,
.select{
    width:100%;
    padding:12px;
    border-radius:14px;
    border:1px solid var(--border);
    background:white;
    outline:none;
}

.range{
    width:100%;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:600;
    color:#334155;
}

/* =========================================================
EDITOR
========================================================= */

#editor{
    min-height:260px;
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
    background:white;
    outline:none;
    font-size:22px;
    line-height:1.6;
    color:#111111;
}

/* =========================================================
WORKSPACE
========================================================= */

.workspace{
    flex:1;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px;
    background:
    radial-gradient(#dbeafe 1px, transparent 1px);
    background-size:24px 24px;
}

/* =========================================================
CANVAS
========================================================= */

.canvas-shell{
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

#svgCanvas{
    display:block;
    background:white;
}

/* =========================================================
MOBILE
========================================================= */

.mobile-nav{
    display:none;
}

@media(max-width:900px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:calc(100vh - 140px);
        display:none;
    }

    .workspace{
        display:none;
        padding:18px;
    }

    .sidebar.active{
        display:block;
    }

    .workspace.active{
        display:flex;
    }

    .mobile-nav{
        display:flex;
        justify-content:space-around;
        align-items:center;
        background:white;
        border-top:1px solid var(--border);
        padding:12px;
    }

    .mobile-nav button{
        border:none;
        background:none;
        font-weight:700;
        color:#64748b;
    }

    .mobile-nav button.active{
        color:var(--primary);
    }

    header{
        flex-direction:column;
        height:auto;
        padding:12px;
        align-items:flex-start;
    }

}

/* =========================================================
COLOR PICKERS
========================================================= */

.color-row{
    display:flex;
    gap:10px;
}

.color-row input{
    flex:1;
    height:50px;
    border:none;
    border-radius:14px;
    overflow:hidden;
}

/* =========================================================
TOOLS
========================================================= */

.tool-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.tool-row button{
    flex:1;
    min-width:90px;
}

</style>

</head>
<body>

<div class="app">

<header>

<div class="logo">
Text<span>.</span>To<span>.</span>Image
</div>

<div class="header-actions">

<button class="btn btn-light" onclick="resetStudio()">
Reset
</button>

<button class="btn btn-dark" onclick="downloadSVG()">
⬇ SVG
</button>

<button class="btn btn-dark" onclick="exportImage('jpg')">
⬇ JPG
</button>

<button class="btn btn-primary" onclick="exportImage('png')">
⬇ PNG
</button>

<button class="btn btn-primary" onclick="downloadPDF()">
⬇ PDF
</button>

</div>

</header>

<div class="main">

<!-- =========================================================
SIDEBAR
========================================================= -->

<aside class="sidebar active" id="sidebar">

<!-- =========================================================
TEXT TOOLS
========================================================= -->

<div class="section">

<div class="section-title">
Text Tools
</div>

<div class="tool-row">

<button class="btn btn-light" onclick="cmd('bold')">
Bold
</button>

<button class="btn btn-light" onclick="cmd('italic')">
Italic
</button>

<button class="btn btn-light" onclick="cmd('underline')">
Underline
</button>

<button class="btn btn-light" onclick="cmd('strikeThrough')">
Strike
</button>

<button class="btn btn-light" onclick="alignText('left')">
Left
</button>

<button class="btn btn-light" onclick="alignText('center')">
Center
</button>

<button class="btn btn-light" onclick="alignText('right')">
Right
</button>

</div>

<br>

<div
id="editor"
contenteditable="true"
oninput="syncEditor()">

<h1>Text To Image Tool</h1>

<p>
Create full page beautiful image posts with SVG rendering engine.
</p>

<ul>
<li>PNG Export</li>
<li>JPG Export</li>
<li>PDF Export</li>
<li>Editable SVG Export</li>
<li>Background Image Editing</li>
<li>Paper Sizes</li>
</ul>

</div>

</div>

<!-- =========================================================
TYPOGRAPHY
========================================================= -->

<div class="section">

<div class="section-title">
Typography
</div>

<label>
Font Family
</label>

<select class="select" onchange="updateFont(this.value)">

<option>Inter</option>
<option>Poppins</option>
<option>Montserrat</option>
<option>Roboto</option>
<option>Playfair Display</option>
<option>Oswald</option>
<option>Bebas Neue</option>
<option>Anton</option>
<option>Fira Code</option>
<option>Lobster</option>
<option>Pacifico</option>
<option>Cinzel</option>
<option>Raleway</option>

</select>

<br><br>

<label>
Font Size
</label>

<input
class="range"
type="range"
min="12"
max="120"
value="32"
oninput="updateTextStyle('fontSize',this.value+'px')"
/>

<br><br>

<label>
Line Height
</label>

<input
class="range"
type="range"
min="1"
max="3"
step="0.1"
value="1.5"
oninput="updateTextStyle('lineHeight',this.value)"
/>

<br><br>

<label>
Letter Spacing
</label>

<input
class="range"
type="range"
min="0"
max="20"
value="0"
oninput="updateTextStyle('letterSpacing',this.value+'px')"
/>

<br><br>

<label>
Text Color
</label>

<div class="color-row">

<input
type="color"
value="#111111"
oninput="updateTextColor(this.value)"
/>

</div>

</div>

<!-- =========================================================
CANVAS
========================================================= -->

<div class="section">

<div class="section-title">
Canvas Size
</div>

<select class="select" onchange="setPaper(this.value)">

<option value="1080x1080">
Instagram Square
</option>

<option value="1080x1920">
Story / Reel
</option>

<option value="1920x1080">
YouTube Thumbnail
</option>

<option value="794x1123">
A4
</option>

<option value="1123x1587">
A3
</option>

<option value="1587x2245">
A2
</option>

<option value="595x842">
Letter
</option>

<option value="custom">
Custom
</option>

</select>

<br><br>

<label>
Custom Width
</label>

<input
class="input"
id="customWidth"
type="number"
value="1080"
/>

<br><br>

<label>
Custom Height
</label>

<input
class="input"
id="customHeight"
type="number"
value="1080"
/>

<br><br>

<button
class="btn btn-primary"
style="width:100%;"
onclick="applyCustomCanvas()">

Apply Canvas

</button>

</div>

<!-- =========================================================
BACKGROUND
========================================================= -->

<div class="section">

<div class="section-title">
Background Studio
</div>

<label>
Background Color
</label>

<div class="color-row">

<input
type="color"
value="#ffffff"
oninput="updateBackgroundColor(this.value)"
/>

</div>

<br><br>

<label>
Upload Background Image
</label>

<input
class="input"
type="file"
accept="image/*"
onchange="uploadBackground(this)"
/>

<br><br>

<label>
Position X
</label>

<input
class="range"
type="range"
min="-1000"
max="1000"
value="0"
oninput="bgPosX=this.value; renderSVG();"
/>

<br><br>

<label>
Position Y
</label>

<input
class="range"
type="range"
min="-1000"
max="1000"
value="0"
oninput="bgPosY=this.value; renderSVG();"
/>

<br><br>

<label>
Zoom
</label>

<input
class="range"
type="range"
min="20"
max="400"
value="100"
oninput="bgScale=this.value; renderSVG();"
/>

<br><br>

<label>
Rotation
</label>

<input
class="range"
type="range"
min="-180"
max="180"
value="0"
oninput="bgRotate=this.value; renderSVG();"
/>

<br><br>

<label>
Opacity
</label>

<input
class="range"
type="range"
min="0"
max="1"
step="0.05"
value="1"
oninput="bgOpacity=this.value; renderSVG();"
/>

<br><br>

<label>
Blur
</label>

<input
class="range"
type="range"
min="0"
max="40"
value="0"
oninput="bgBlur=this.value; renderSVG();"
/>

</div>

</aside>

<!-- =========================================================
WORKSPACE
========================================================= -->

<section class="workspace active" id="workspace">

<div class="canvas-shell">

<svg
id="svgCanvas"
xmlns="http://www.w3.org/2000/svg"
width="1080"
height="1080">

</svg>

</div>

</section>

</div>

<!-- =========================================================
MOBILE NAV
========================================================= -->

<nav class="mobile-nav">

<button
class="active"
id="editBtn"
onclick="showPanel('edit')">

EDIT

</button>

<button
id="previewBtn"
onclick="showPanel('preview')">

PREVIEW

</button>

</nav>

</div>

<script>

/* =========================================================
STATE
========================================================= */

const editor =
document.getElementById("editor");

const svgCanvas =
document.getElementById("svgCanvas");

let canvasWidth = 1080;
let canvasHeight = 1080;

let bgColor = "#ffffff";
let bgImage = "";

let bgPosX = 0;
let bgPosY = 0;
let bgScale = 100;
let bgRotate = 0;
let bgOpacity = 1;
let bgBlur = 0;

let textColor = "#111111";

/* =========================================================
TEXT COMMANDS
========================================================= */

function cmd(command){

    document.execCommand(command,false,null);

    syncEditor();

}

function alignText(type){

    editor.style.textAlign = type;

    syncEditor();

}

/* =========================================================
TEXT STYLE
========================================================= */

function updateFont(font){

    editor.style.fontFamily = font;

    syncEditor();

}

function updateTextStyle(prop,val){

    editor.style[prop] = val;

    syncEditor();

}

function updateTextColor(color){

    textColor = color;

    editor.style.color = color;

    syncEditor();

}

/* =========================================================
BACKGROUND
========================================================= */

function updateBackgroundColor(color){

    bgColor = color;

    renderSVG();

}

function uploadBackground(input){

    const file = input.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        bgImage = e.target.result;

        renderSVG();

    };

    reader.readAsDataURL(file);

}

/* =========================================================
PAPER SIZE
========================================================= */

function setPaper(size){

    if(size === "custom") return;

    const arr = size.split("x");

    canvasWidth = parseInt(arr[0]);
    canvasHeight = parseInt(arr[1]);

    renderSVG();

}

function applyCustomCanvas(){

    canvasWidth =
    parseInt(
    document.getElementById("customWidth").value
    );

    canvasHeight =
    parseInt(
    document.getElementById("customHeight").value
    );

    renderSVG();

}

/* =========================================================
SYNC
========================================================= */

function syncEditor(){

    renderSVG();

}

/* =========================================================
RENDER SVG
========================================================= */

function renderSVG(){

    svgCanvas.setAttribute(
    "width",
    canvasWidth
    );

    svgCanvas.setAttribute(
    "height",
    canvasHeight
    );

    let bgLayer = `
    <rect
    width="100%"
    height="100%"
    fill="${bgColor}" />
    `;

    if(bgImage){

        bgLayer += `

        <defs>

        <filter id="bgBlurFilter">
        <feGaussianBlur stdDeviation="${bgBlur}" />
        </filter>

        </defs>

        <image
        href="${bgImage}"
        x="${bgPosX}"
        y="${bgPosY}"
        width="${canvasWidth * (bgScale/100)}"
        height="${canvasHeight * (bgScale/100)}"
        opacity="${bgOpacity}"
        preserveAspectRatio="xMidYMid slice"
        filter="url(#bgBlurFilter)"
        transform="
        rotate(
        ${bgRotate}
        ${canvasWidth/2}
        ${canvasHeight/2}
        )"
        />

        `;
    }

    svgCanvas.innerHTML = `

    ${bgLayer}

    <foreignObject
    x="60"
    y="60"
    width="${canvasWidth - 120}"
    height="${canvasHeight - 120}">

    <div xmlns="http://www.w3.org/1999/xhtml"
    style="
    width:100%;
    height:100%;
    color:${textColor};
    font-family:${getComputedStyle(editor).fontFamily};
    font-size:${getComputedStyle(editor).fontSize};
    line-height:${getComputedStyle(editor).lineHeight};
    letter-spacing:${getComputedStyle(editor).letterSpacing};
    text-align:${getComputedStyle(editor).textAlign};
    overflow-wrap:break-word;
    ">

    ${editor.innerHTML}

    </div>

    </foreignObject>

    `;

}

/* =========================================================
DOWNLOAD SVG
========================================================= */

function downloadSVG(){

    const serializer =
    new XMLSerializer();

    let source =
    serializer.serializeToString(svgCanvas);

    source =
    '<?xml version="1.0" standalone="no"?>\r\n' +
    source;

    const blob =
    new Blob(
    [source],
    {
        type:"image/svg+xml;charset=utf-8"
    });

    const url =
    URL.createObjectURL(blob);

    const link =
    document.createElement("a");

    link.href = url;

    link.download =
    "Text-To-Image.svg";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}

/* =========================================================
EXPORT PNG/JPG
========================================================= */

function exportImage(type){

    const serializer =
    new XMLSerializer();

    const source =
    serializer.serializeToString(svgCanvas);

    const svgBlob =
    new Blob(
    [source],
    {
        type:"image/svg+xml;charset=utf-8"
    });

    const url =
    URL.createObjectURL(svgBlob);

    const img =
    new Image();

    img.onload = function(){

        const canvas =
        document.createElement("canvas");

        const scale = 3;

        canvas.width =
        canvasWidth * scale;

        canvas.height =
        canvasHeight * scale;

        const ctx =
        canvas.getContext("2d");

        ctx.scale(scale,scale);

        if(type === "jpg"){

            ctx.fillStyle =
            bgColor;

            ctx.fillRect(
            0,
            0,
            canvasWidth,
            canvasHeight
            );

        }

        ctx.drawImage(
        img,
        0,
        0,
        canvasWidth,
        canvasHeight
        );

        const link =
        document.createElement("a");

        link.download =
        `Text-To-Image.${type}`;

        link.href =
        type === "png"
        ?
        canvas.toDataURL("image/png",1)
        :
        canvas.toDataURL("image/jpeg",1);

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    };

    img.onerror = function(){

        alert("Export failed.");

    };

    const reader =
    new FileReader();

    reader.onload = function(){

        img.src = reader.result;

    };

    reader.readAsDataURL(svgBlob);

}

/* =========================================================
PDF
========================================================= */

function downloadPDF(){

    const serializer =
    new XMLSerializer();

    const source =
    serializer.serializeToString(svgCanvas);

    const svgBlob =
    new Blob(
    [source],
    {
        type:"image/svg+xml;charset=utf-8"
    });

    const img =
    new Image();

    img.onload = function(){

        const canvas =
        document.createElement("canvas");

        const scale = 3;

        canvas.width =
        canvasWidth * scale;

        canvas.height =
        canvasHeight * scale;

        const ctx =
        canvas.getContext("2d");

        ctx.scale(scale,scale);

        ctx.fillStyle =
        bgColor;

        ctx.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
        );

        ctx.drawImage(
        img,
        0,
        0,
        canvasWidth,
        canvasHeight
        );

        const image =
        canvas.toDataURL(
        "image/jpeg",
        1
        );

        const pdfWindow =
        window.open("");

        pdfWindow.document.write(`

        <html>

        <head>

        <title>
        Text To Image PDF
        </title>

        <style>

        body{
            margin:0;
        }

        img{
            width:100%;
            display:block;
        }

        </style>

        </head>

        <body>

        <img
        src="${image}"
        onload="window.print()"
        />

        </body>

        </html>

        `);

    };

    const reader =
    new FileReader();

    reader.onload = function(){

        img.src = reader.result;

    };

    reader.readAsDataURL(svgBlob);

}

/* =========================================================
RESET
========================================================= */

function resetStudio(){

    location.reload();

}

/* =========================================================
MOBILE
========================================================= */

function showPanel(type){

    const sidebar =
    document.getElementById("sidebar");

    const workspace =
    document.getElementById("workspace");

    const editBtn =
    document.getElementById("editBtn");

    const previewBtn =
    document.getElementById("previewBtn");

    if(type === "edit"){

        sidebar.classList.add("active");

        workspace.classList.remove("active");

        editBtn.classList.add("active");

        previewBtn.classList.remove("active");

    }else{

        workspace.classList.add("active");

        sidebar.classList.remove("active");

        previewBtn.classList.add("active");

        editBtn.classList.remove("active");

    }

}

/* =========================================================
INIT
========================================================= */

window.onload = function(){

    renderSVG();

};

</script>

</body>
</html>
