<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WordArt Studio Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;800&family=Montserrat:wght@400;900&family=Playfair+Display:wght@700&family=Bungee&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>

    <style>
        :root {
            --primary: #4f6bff;
            --bg-dark: #0f1220;
            --panel-bg: #161b33;
            --input-bg: #1f2544;
            --text-main: #ffffff;
            /* Dynamic Vars */
            --global-font-size: 40px;
            --global-font-family: 'Inter';
            --global-stroke: 0px;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 25px;
            background: var(--panel-bg);
            border-bottom: 1px solid #2d3561;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .controls {
            overflow-y: auto;
            padding: 20px;
            background: var(--panel-bg);
            border-right: 1px solid #2d3561;
        }

        .control-group {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d3561;
        }

        h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        input[type="text"], textarea, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #333c66;
            color: white;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            cursor: pointer;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover { filter: brightness(1.2); }
        button.secondary { background: #333c66; }

        /* Preview Area */
        .preview-area {
            background: #080a18;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 40px;
            position: relative;
        }

        #renderBox {
            padding: 60px;
            background: #111;
            border-radius: 12px;
            min-width: 300px;
            text-align: center;
            font-family: var(--global-font-family);
            font-size: var(--global-font-size);
            line-height: 1.4;
            transition: background 0.3s;
            position: relative;
        }

        /* Word Styling */
        .word {
            display: inline-block;
            cursor: pointer;
            padding: 0 4px;
            border: 2px solid transparent;
            transition: all 0.2s;
            -webkit-text-stroke: var(--global-stroke) currentColor;
        }

        .word:hover {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .word.selected {
            border: 2px dashed var(--primary);
            border-radius: 4px;
            background: rgba(79, 107, 255, 0.2);
        }

        /* Effects */
        .glow { text-shadow: 0 0 15px currentColor; }
        .skew { transform: skew(-15deg); }
        .anim-pulse { animation: pulse 1.5s infinite alternate ease-in-out; }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        svg { overflow: visible; width: 100%; height: auto; }

        @media (max-width: 800px) {
            .main-container { grid-template-columns: 1fr; }
            .controls { height: 300px; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; font-size: 1.2rem;">WORDART <span style="color: var(--primary)">STUDIO</span></div>
    <div id="statusMsg" style="font-size: 12px; opacity: 0.7;">Ready</div>
</header>

<main class="main-container">
    <div class="controls">
        
        <div class="control-group">
            <h3>1. Content</h3>
            <textarea id="textInput" rows="3" placeholder="Enter text here..." oninput="renderText()">Type something cool</textarea>
            <label>Font Family</label>
            <select id="fontSelect" onchange="updateGlobalStyles()">
                <option value="Inter">Inter (Clean)</option>
                <option value="Poppins">Poppins (Modern)</option>
                <option value="Montserrat">Montserrat (Bold)</option>
                <option value="Playfair Display">Playfair (Elegant)</option>
                <option value="Bungee">Bungee (Comic)</option>
            </select>
        </div>

        <div class="control-group">
            <h3>2. Global Style</h3>
            <label>Font Size</label>
            <input type="range" min="20" max="150" value="50" id="fontSize" oninput="updateGlobalStyles()">
            
            <label>Stroke Width</label>
            <input type="range" min="0" max="5" step="0.5" value="0" id="strokeWidth" oninput="updateGlobalStyles()">
            
            <label>Canvas Background</label>
            <input type="color" id="bgColor" value="#111111" onchange="updateCanvasBg()" style="height:40px">
        </div>

        <div class="control-group" id="wordControls" style="opacity: 0.5; pointer-events: none;">
            <h3>3. Selected Word Style</h3>
            <label>Text Color</label>
            <input type="color" id="wordColor" value="#ffffff" oninput="applyWordStyle()">
            
            <div style="display: flex; gap: 10px; margin-top:10px;">
                <label><input type="checkbox" id="glowToggle" onchange="applyWordStyle()"> Glow</label>
                <label><input type="checkbox" id="skewToggle" onchange="applyWordStyle()"> Skew</label>
            </div>
        </div>

        <div class="control-group">
            <h3>4. Layout & Path</h3>
            <select id="curveType" onchange="renderText()">
                <option value="none">Straight Layout</option>
                <option value="arc">Arc Path</option>
            </select>
            <label>Path Radius</label>
            <input type="range" min="100" max="500" value="250" id="radius" oninput="renderText()">
        </div>

        <div class="control-group">
            <h3>5. Export</h3>
            <div class="btn-grid">
                <button onclick="exportImage('png')">Download PNG</button>
                <button class="secondary" onclick="copyClipboard()">Copy Image</button>
            </div>
            <button onclick="toggleAnimation()" style="width:100%; margin-top:8px;" id="animBtn">Toggle Animation</button>
        </div>
    </div>

    <div class="preview-area">
        <div id="renderBox">
            <!-- Content generated by JS -->
        </div>
    </div>
</main>

<script>
    let selectedWordEl = null;
    let isAnimated = false;

    // Initialize
    window.onload = () => {
        renderText();
        updateGlobalStyles();
    };

    function renderText() {
        const box = document.getElementById("renderBox");
        const text = document.getElementById("textInput").value;
        const curve = document.getElementById("curveType").value;
        
        // Clear box
        box.innerHTML = "";
        selectedWordEl = null;
        document.getElementById("wordControls").style.opacity = "0.5";
        document.getElementById("wordControls").style.pointerEvents = "none";

        if (curve === "none") {
            const words = text.split(/\s+/);
            words.forEach(w => {
                if(!w) return;
                const span = document.createElement("span");
                span.className = "word";
                span.textContent = w + " ";
                span.onclick = (e) => {
                    e.stopPropagation();
                    selectWord(span);
                };
                box.appendChild(span);
            });
        } else {
            // SVG Path Logic
            const r = document.getElementById("radius").value;
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", `0 0 ${r*2} ${r}`);
            
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("id", "curvePath");
            path.setAttribute("fill", "transparent");
            path.setAttribute("d", `M 0 ${r} A ${r} ${r} 0 0 1 ${r*2} ${r}`);
            
            const textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");
            textNode.setAttribute("fill", "white");
            textNode.style.fontFamily = "inherit";
            
            const textPath = document.createElementNS("http://www.w3.org/2000/svg", "textPath");
            textPath.setAttribute("href", "#curvePath");
            textPath.setAttribute("startOffset", "50%");
            textPath.setAttribute("text-anchor", "middle");
            textPath.textContent = text;

            textNode.appendChild(textPath);
            svg.appendChild(path);
            svg.appendChild(textNode);
            box.appendChild(svg);
        }
    }

    function updateGlobalStyles() {
        const root = document.documentElement;
        const font = document.getElementById("fontSelect").value;
        const size = document.getElementById("fontSize").value;
        const stroke = document.getElementById("strokeWidth").value;

        root.style.setProperty('--global-font-family', font);
        root.style.setProperty('--global-font-size', size + "px");
        root.style.setProperty('--global-stroke', stroke + "px");
    }

    function selectWord(el) {
        // Clear previous selection
        document.querySelectorAll(".word").forEach(w => w.classList.remove("selected"));
        
        selectedWordEl = el;
        el.classList.add("selected");

        // Enable word controls
        const ctrl = document.getElementById("wordControls");
        ctrl.style.opacity = "1";
        ctrl.style.pointerEvents = "all";

        // Sync control values with element current state
        document.getElementById("wordColor").value = rgbToHex(window.getComputedStyle(el).color);
        document.getElementById("glowToggle").checked = el.classList.contains("glow");
        document.getElementById("skewToggle").checked = el.classList.contains("skew");
    }

    function applyWordStyle() {
        if (!selectedWordEl) return;
        
        selectedWordEl.style.color = document.getElementById("wordColor").value;
        
        if (document.getElementById("glowToggle").checked) 
            selectedWordEl.classList.add("glow");
        else 
            selectedWordEl.classList.remove("glow");

        if (document.getElementById("skewToggle").checked) 
            selectedWordEl.classList.add("skew");
        else 
            selectedWordEl.classList.remove("skew");
    }

    function updateCanvasBg() {
        document.getElementById("renderBox").style.background = document.getElementById("bgColor").value;
    }

    function toggleAnimation() {
        isAnimated = !isAnimated;
        document.getElementById("renderBox").classList.toggle("anim-pulse", isAnimated);
        document.getElementById("animBtn").innerText = isAnimated ? "Stop Animation" : "Toggle Animation";
    }

    function exportImage(format) {
        showStatus("Rendering...");
        const node = document.getElementById("renderBox");
        
        // Remove selection border before export
        const prevSelected = selectedWordEl;
        if(selectedWordEl) selectedWordEl.classList.remove("selected");

        domtoimage.toBlob(node, { scale: 2 })
            .then(blob => {
                const link = document.createElement('a');
                link.download = `wordart-${Date.now()}.${format}`;
                link.href = URL.createObjectURL(blob);
                link.click();
                showStatus("Exported!");
                if(prevSelected) prevSelected.classList.add("selected");
            });
    }

    async function copyClipboard() {
        showStatus("Copying...");
        const node = document.getElementById("renderBox");
        const blob = await domtoimage.toBlob(node);
        try {
            await navigator.clipboard.write([
                new ClipboardItem({ "image/png": blob })
            ]);
            showStatus("Copied to clipboard!");
        } catch (err) {
            showStatus("Copy failed.");
        }
    }

    function showStatus(msg) {
        const el = document.getElementById("statusMsg");
        el.innerText = msg;
        setTimeout(() => el.innerText = "Ready", 2000);
    }

    // Helper: Convert RGB to Hex for color input sync
    function rgbToHex(rgb) {
        if (!rgb) return "#ffffff";
        const vals = rgb.match(/\d+/g);
        if (!vals) return "#ffffff";
        return "#" + vals.slice(0,3).map(x => {
            const hex = parseInt(x).toString(16);
            return hex.length === 1 ? "0" + hex : hex;
        }).join("");
    }
</script>

</body>
</html>
