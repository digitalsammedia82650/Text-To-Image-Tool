<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Note Studio | Document-to-Image</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@300;400;700&family=Lobster&family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono&family=Fira+Code&family=Permanent+Marker&family=Righteous&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --accent: #0078d4;
            --bg: #f0f2f5;
            --panel: #ffffff;
            --toolbar: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* Allow scrolling on body for mobile if content overflows */
            overflow-x: hidden;
        }

        /* --- UI Panels --- */
        header {
            background: #0078d4;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .main-toolbar {
            background: var(--toolbar);
            padding: 8px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            overflow-x: auto; /* Scroll horizontally on mobile */
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .main-toolbar::-webkit-scrollbar { display: none; }

        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            flex-grow: 1;
            overflow: hidden;
        }

        .sidebar {
            background: var(--panel);
            padding: 20px;
            border: 1px solid #ddd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .sidebar h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
        }

        /* --- The Document Canvas --- */
        .canvas-area {
            padding: 20px;
            overflow: auto;
            background: #cbd5e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #paper-wrapper {
            transition: transform 0.3s ease;
            transform-origin: top center;
            margin-bottom: 50px;
        }

        #paper {
            background: white;
            box-shadow: var(--shadow);
            padding: 40px; /* Reduced for mobile */
            outline: none;
            box-sizing: border-box;
            min-height: 500px;
            width: 794px; /* Default A4 */
        }

        /* --- Buttons & Tools --- */
        .btn {
            background: white;
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .btn:active { background: #e0e0e0; }
        
        .export-btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }

        select, input[type="range"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px; /* Prevents iOS zoom on focus */
        }

        /* --- Mobile Toggle Buttons --- */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            border: none;
            font-size: 24px;
        }

        /* --- WORDART GALLERY STYLES (Keep existing) --- */
        .wa-neon { color: #fff; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 30px #0ff, 0 0 40px #0ff; }
        .wa-fire { color: #f5af19; text-shadow: 0 0 20px #f12711; font-weight: 900; }
        .wa-3d-deep { color: white; text-shadow: 0 1px 0 #ccc, 0 2px 0 #c9c9c9, 0 3px 0 #bbb, 0 4px 0 #b9b9b9, 0 5px 0 #aaa, 0 6px 1px rgba(0,0,0,.1), 0 0 5px rgba(0,0,0,.1), 0 1px 3px rgba(0,0,0,.3), 0 3px 5px rgba(0,0,0,.2), 0 5px 10px rgba(0,0,0,.25); font-weight: 800; }
        .wa-retro { color: #ffbe0b; text-shadow: 4px 4px 0px #ff006e; font-family: 'Righteous', sans-serif; }
        .wa-outline { color: transparent; -webkit-text-stroke: 1.5px #333; }
        .wa-gradient-blue { background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .wa-gradient-sunset { background: linear-gradient(to right, #f12711, #f5af19); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }
        .wa-stacked { color: #2d3436; text-shadow: 2px 2px 0px #fab1a0, 4px 4px 0px #ff7675; font-weight: 900; }
        .wa-cyber { color: #00ff41; background: #000; padding: 0 5px; font-family: 'Fira Code', monospace; }
        .wa-marker { font-family: 'Permanent Marker', cursive; color: #2e86de; }
        .wa-glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); padding: 2px 5px; border-radius: 4px; }
        .wa-comic { font-family: 'Bungee', cursive; color: white; -webkit-text-stroke: 1px black; text-shadow: 3px 3px 0px black; }

        .wa-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .wa-item {
            border: 1px solid #eee;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            background: #fafafa;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
                height: auto;
                overflow: visible;
            }

            .sidebar {
                display: none; /* Hide sidebars by default on mobile */
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 500;
                box-sizing: border-box;
            }

            .sidebar.active {
                display: flex;
            }

            .canvas-area {
                padding: 10px;
                height: calc(100vh - 120px);
            }

            .mobile-toggle {
                display: block;
            }

            #paper {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; font-size: 1rem;">ULTIMATE NOTE <span style="font-weight: 300;">STUDIO</span></div>
    <div id="status" style="font-size: 11px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 20px;">Live</div>
</header>

<div class="main-toolbar">
    <select id="mainFont" onchange="format('fontName', this.value)" style="width:130px; margin-right:5px;">
        <option value="Segoe UI">System</option>
        <option value="Inter">Modern</option>
        <option value="Playfair Display">Serif</option>
        <option value="Fira Code">Mono</option>
    </select>
    <button class="btn" onclick="format('bold')"><b>B</b></button>
    <button class="btn" onclick="format('italic')"><i>I</i></button>
    <button class="btn" onclick="format('underline')"><u>U</u></button>
    <button class="btn" onclick="format('justifyLeft')">L</button>
    <button class="btn" onclick="format('justifyCenter')">C</button>
    <button class="btn" onclick="format('insertUnorderedList')">• List</button>
    <input type="color" onchange="format('foreColor', this.value)" style="width:40px; height:35px; padding:2px;">
</div>

<main class="workspace">
    
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar-left">
        <button class="btn" onclick="toggleSidebar('sidebar-left')" style="align-self: flex-end; margin-bottom: 10px;">✕ Close</button>
        <h3>1. Page Setup</h3>
        <label>Dimensions</label>
        <select id="pageSize" onchange="updatePaperSize()">
            <option value="a4" selected>A4 (Standard)</option>
            <option value="letter">US Letter</option>
            <option value="square">Square</option>
            <option value="story">Story (Vertical)</option>
        </select>

        <label>Canvas Color</label>
        <input type="color" id="pageBg" value="#ffffff" oninput="updatePaperStyle()">

        <label>Zoom View</label>
        <input type="range" id="zoomRange" min="0.1" max="1.5" step="0.01" value="0.75" oninput="zoom(this.value)">
        
        <h3>2. Note Footer</h3>
        <input type="text" id="footerText" placeholder="Enter footer note..." oninput="updateFooter()">
    </aside>

    <!-- Center Canvas -->
    <section class="canvas-area">
        <div id="paper-wrapper">
            <div id="paper" contenteditable="true" spellcheck="false">
                <h1>Discussion Notes</h1>
                <p>Tap here to start typing. Highlight text to apply styles or WordArt.</p>
            </div>
            <div id="footerDisplay" style="text-align:center; margin-top:20px; opacity:0.4; font-size:14px;"></div>
        </div>
    </section>

    <!-- Right Sidebar -->
    <aside class="sidebar" id="sidebar-right">
        <button class="btn" onclick="toggleSidebar('sidebar-right')" style="align-self: flex-end; margin-bottom: 10px;">✕ Close</button>
        <h3>3. WordArt Gallery</h3>
        <div class="wa-grid">
            <div class="wa-item wa-neon" onclick="applyWA('wa-neon')">Neon</div>
            <div class="wa-item wa-3d-deep" style="background:#444" onclick="applyWA('wa-3d-deep')">3D</div>
            <div class="wa-item wa-retro" onclick="applyWA('wa-retro')">Retro</div>
            <div class="wa-item wa-comic" onclick="applyWA('wa-comic')">Comic</div>
            <div class="wa-item wa-gradient-blue" onclick="applyWA('wa-gradient-blue')">Ocean</div>
            <div class="wa-item wa-cyber" onclick="applyWA('wa-cyber')">Cyber</div>
            <div class="wa-item wa-marker" onclick="applyWA('wa-marker')">Marker</div>
            <div class="wa-item wa-glass" style="background:#ddd" onclick="applyWA('wa-glass')">Glass</div>
        </div>
        <button class="btn" style="width:100%; margin-top:10px;" onclick="format('removeFormat')">Clear Styling</button>

        <h3>4. Export</h3>
        <button class="export-btn" style="background:#107c10" onclick="exportImg()">PNG Image</button>
        <button class="export-btn" style="background:#e81123" onclick="exportPdf()">PDF Document</button>
        <button class="export-btn" style="background:#0078d4" onclick="copyToClipboard()">Copy to Clipboard</button>
    </aside>
</main>

<!-- Floating Mobile Buttons -->
<button class="mobile-toggle" style="bottom: 90px;" onclick="toggleSidebar('sidebar-left')">⚙️</button>
<button class="mobile-toggle" onclick="toggleSidebar('sidebar-right')">🎨</button>

<script>
    const { jsPDF } = window.jspdf;

    const sizes = {
        a4: [794, 1123],
        letter: [816, 1056],
        square: [800, 800],
        story: [600, 1067]
    };

    function format(cmd, val = null) {
        document.execCommand(cmd, false, val);
    }

    function toggleSidebar(id) {
        document.getElementById(id).classList.toggle('active');
    }

    function applyWA(cls) {
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const span = document.createElement("span");
            span.className = cls;
            selection.getRangeAt(0).surroundContents(span);
        }
        if(window.innerWidth < 1024) toggleSidebar('sidebar-right');
    }

    function updatePaperSize() {
        const key = document.getElementById('pageSize').value;
        const paper = document.getElementById('paper');
        paper.style.width = sizes[key][0] + "px";
        paper.style.minHeight = sizes[key][1] + "px";
        autoScale();
    }

    function updatePaperStyle() {
        const bg = document.getElementById('pageBg').value;
        const paper = document.getElementById('paper');
        paper.style.backgroundColor = bg;
        const r = parseInt(bg.slice(1,3), 16);
        const g = parseInt(bg.slice(3,5), 16);
        const b = parseInt(bg.slice(5,7), 16);
        paper.style.color = (r*0.299 + g*0.587 + b*0.114) > 150 ? '#111' : '#fff';
    }

    function zoom(v) {
        document.getElementById('paper-wrapper').style.transform = `scale(${v})`;
    }

    function autoScale() {
        if(window.innerWidth < 850) {
            const containerWidth = document.querySelector('.canvas-area').offsetWidth - 40;
            const paperWidth = parseInt(document.getElementById('paper').style.width);
            const scale = containerWidth / paperWidth;
            document.getElementById('zoomRange').value = scale;
            zoom(scale);
        }
    }

    function updateFooter() {
        document.getElementById('footerDisplay').innerText = document.getElementById('footerText').value;
    }

    function setStatus(msg) {
        const s = document.getElementById('status');
        s.innerText = msg;
        setTimeout(() => s.innerText = "Live", 3000);
    }

    // --- Export Logic ---
    async function exportImg() {
        setStatus("Working...");
        const node = document.getElementById('paper-wrapper');
        const blob = await domtoimage.toBlob(node, { scale: 2 });
        const link = document.createElement('a');
        link.download = `Note-${Date.now()}.png`;
        link.href = URL.createObjectURL(blob);
        link.click();
        setStatus("Done!");
    }

    async function copyToClipboard() {
        setStatus("Copying...");
        try {
            const node = document.getElementById('paper-wrapper');
            const blob = await domtoimage.toBlob(node, { scale: 2 });
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
            setStatus("Copied!");
        } catch (err) { setStatus("Error!"); }
    }

    async function exportPdf() {
        setStatus("PDF...");
        const node = document.getElementById('paper-wrapper');
        const paper = document.getElementById('paper');
        const w = paper.offsetWidth;
        const h = paper.offsetHeight;
        const imgData = await domtoimage.toPng(node, { scale: 1.5 });
        const pdf = new jsPDF({ unit: 'px', format: [w, h] });
        pdf.addImage(imgData, 'PNG', 0, 0, w, h);
        pdf.save(`Doc-${Date.now()}.pdf`);
        setStatus("Done!");
    }

    window.onload = () => {
        updatePaperSize();
        updatePaperStyle();
        window.addEventListener('resize', autoScale);
    }
</script>

</body>
</html>
