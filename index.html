<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Text-to-Image Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Fira+Code&family=Bungee&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://unpkg.com/dom-to-image-more@2.9.5/dist/dom-to-image-more.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            padding: 12px 20px; background: var(--panel);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .logo { font-weight: 900; letter-spacing: -1px; font-size: 1.2rem; }
        .logo span { color: var(--primary); }

        /* --- LAYOUT ENGINE --- */
        main { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar (Editor & Styles) */
        .sidebar {
            width: 380px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            z-index: 10;
        }

        /* Canvas Workspace */
        .workspace {
            flex: 1;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 40px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- COMPONENTS --- */
        .section { padding: 20px; border-bottom: 1px solid var(--border); }
        .label { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; display: block; font-weight: 700; }

        #editor {
            min-height: 150px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; outline: none; font-size: 16px; line-height: 1.5;
        }

        #renderBox {
            position: relative; background: #111; padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            word-wrap: break-word; overflow: hidden;
            background-size: cover; background-position: center;
            transition: transform 0.2s ease;
        }

        /* Buttons & Controls */
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        
        button.tool-btn {
            background: #334155; color: white; border: none;
            padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600;
            transition: 0.2s;
        }
        button.tool-btn:hover { background: #475569; }
        button.tool-btn.active { background: var(--primary); }

        select, input[type="range"], input[type="color"] {
            width: 100%; background: #0f172a; color: white;
            border: 1px solid var(--border); padding: 8px; border-radius: 6px; outline: none;
        }

        /* Mobile Tab Bar */
        .mobile-nav {
            display: none; background: var(--panel);
            padding: 10px; border-top: 1px solid var(--border);
        }

        /* --- RESPONSIVE LOGIC --- */
        @media (max-width: 900px) {
            main { flex-direction: column; }
            .sidebar { width: 100%; height: 100%; display: none; }
            .sidebar.active { display: flex; }
            .workspace { display: none; height: 100%; }
            .workspace.active { display: flex; }
            .mobile-nav { display: flex; justify-content: space-around; }
            .mobile-nav button {
                background: none; border: none; color: #94a3b8; font-weight: 600; font-size: 12px;
            }
            .mobile-nav button.active { color: var(--primary); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">STUDIO<span>.</span></div>
    <div style="display:flex; gap:10px;">
        <button class="tool-btn" style="background:transparent;" onclick="localStorage.clear(); location.reload();">Reset</button>
        <button class="tool-btn" style="background:var(--primary);" onclick="exportImage()">Download PNG</button>
    </div>
</header>

<main>
    <!-- Left Sidebar: Controls -->
    <aside class="sidebar active" id="sidebar">
        <div class="section">
            <span class="label">1. Text Content</span>
            <div class="btn-group">
                <button class="tool-btn" onclick="exec('bold')" title="Ctrl+B"><b>B</b></button>
                <button class="tool-btn" onclick="exec('italic')" title="Ctrl+I"><i>I</i></button>
                <button class="tool-btn" onclick="exec('underline')"><u>U</u></button>
                <button class="tool-btn" onclick="exec('justifyCenter')">Center</button>
                <button class="tool-btn" onclick="exec('insertUnorderedList')">List</button>
            </div>
            <div id="editor" contenteditable="true" oninput="sync()">Hello! Type something beautiful here...</div>
        </div>

        <div class="section">
            <span class="label">2. Typography</span>
            <div class="btn-group">
                <select onchange="exec('fontName', this.value)" style="flex:1">
                    <option value="Inter">Inter (Sans)</option>
                    <option value="Playfair Display">Playfair (Serif)</option>
                    <option value="Fira Code">Fira Code (Mono)</option>
                    <option value="Bungee">Bungee (Display)</option>
                </select>
                <input type="color" onchange="exec('foreColor', this.value)" style="width:45px; padding:2px;">
            </div>
            <div style="display:flex; gap:15px; align-items:center;">
                <div style="flex:1">
                    <span class="label" style="font-size:9px">Size</span>
                    <input type="range" min="12" max="100" value="32" oninput="updateStyle('fontSize', this.value + 'px')">
                </div>
                <div style="flex:1">
                    <span class="label" style="font-size:9px">Spacing</span>
                    <input type="range" min="0.8" max="2.5" step="0.1" value="1.3" oninput="updateStyle('lineHeight', this.value)">
                </div>
            </div>
        </div>

        <div class="section">
            <span class="label">3. Canvas Design</span>
            <div class="btn-group">
                <button class="tool-btn active" id="r1" onclick="setRatio('1:1', 'r1')">1:1</button>
                <button class="tool-btn" id="r2" onclick="setRatio('9:16', 'r2')">9:16</button>
                <button class="tool-btn" id="r3" onclick="setRatio('16:9', 'r3')">16:9</button>
            </div>
            <span class="label" style="font-size:9px; margin-top:10px;">Background</span>
            <div style="display:flex; gap:10px;">
                <input type="color" value="#111111" oninput="changeBg(this.value)" style="width:45px;">
                <button class="tool-btn" style="flex:1" onclick="document.getElementById('bgUpload').click()">Upload Image</button>
                <input type="file" id="bgUpload" hidden accept="image/*" onchange="handleBgUpload(this)">
            </div>
            <button class="tool-btn" style="width:100%; margin-top:10px; border:1px solid var(--primary);" onclick="toggleGlow()">Toggle Glow Effect</button>
        </div>
    </aside>

    <!-- Right Area: Live Preview -->
    <section class="workspace active" id="workspace">
        <div id="renderBox"></div>
    </section>
</main>

<nav class="mobile-nav">
    <button id="nav-edit" class="active" onclick="mSwitch('edit')">EDIT</button>
    <button id="nav-preview" onclick="mSwitch('preview')">PREVIEW</button>
</nav>

<script>
    const editor = document.getElementById('editor');
    const renderBox = document.getElementById('renderBox');

    // Sync Content
    function sync() {
        renderBox.innerHTML = editor.innerHTML;
        localStorage.setItem('studio_data', editor.innerHTML);
    }

    function exec(cmd, val = null) {
        document.execCommand(cmd, false, val);
        sync();
    }

    // Styling
    function updateStyle(prop, val) {
        renderBox.style[prop] = val;
    }

    function changeBg(color) {
        renderBox.style.backgroundImage = 'none';
        renderBox.style.backgroundColor = color;
    }

    function handleBgUpload(input) {
        const reader = new FileReader();
        reader.onload = (e) => renderBox.style.backgroundImage = `url(${e.target.result})`;
        reader.readAsDataURL(input.files[0]);
    }

    function setRatio(ratio, id) {
        document.querySelectorAll('.sidebar .tool-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        const map = { '1:1': [500, 500], '9:16': [400, 711], '16:9': [700, 393] };
        renderBox.style.width = map[ratio][0] + 'px';
        renderBox.style.height = map[ratio][1] + 'px';
    }

    let glow = false;
    function toggleGlow() {
        glow = !glow;
        renderBox.style.textShadow = glow ? '0 0 20px currentColor' : 'none';
    }

    // Mobile Navigation
    function mSwitch(mode) {
        const side = document.getElementById('sidebar');
        const work = document.getElementById('workspace');
        const btnE = document.getElementById('nav-edit');
        const btnP = document.getElementById('nav-preview');

        if(mode === 'edit') {
            side.classList.add('active'); work.classList.remove('active');
            btnE.classList.add('active'); btnP.classList.remove('active');
        } else {
            side.classList.remove('active'); work.classList.add('active');
            btnE.classList.remove('active'); btnP.classList.add('active');
        }
    }

    // Computer Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if(e.ctrlKey || e.metaKey) {
            if(e.key === 'b') { e.preventDefault(); exec('bold'); }
            if(e.key === 'i') { e.preventDefault(); exec('italic'); }
        }
    });

    // High Res Export
    function exportImage() {
        const btn = event.target;
        btn.innerText = "Generating...";
        domtoimage.toBlob(renderBox, { 
            scale: 3,
            style: { transform: 'scale(1)', transformOrigin: 'top left' }
        }).then(blob => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `Studio-${Date.now()}.png`;
            a.click();
            btn.innerText = "Download PNG";
        });
    }

    window.onload = () => {
        const saved = localStorage.getItem('studio_data');
        if(saved) editor.innerHTML = saved;
        setRatio('1:1', 'r1');
        sync();
    };
</script>

</body>
</html>
