<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Text To Image Tool</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;700;800&family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@700&family=Oswald:wght@400;600&family=Bebas+Neue&family=Anton&family=Fira+Code&family=Lobster&family=Pacifico&display=swap" rel="stylesheet">

<style>

/* =========================================================
ROOT
========================================================= */

:root{
    --bg:#edf2f7;
    --panel:#ffffff;
    --border:#dbe3ef;
    --text:#0f172a;
    --muted:#64748b;
    --primary:#7c3aed;
    --primary-hover:#6d28d9;
    --shadow:0 10px 50px rgba(15,23,42,.08);
}

/* =========================================================
GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:Inter,sans-serif;
    color:var(--text);
}

button,
input,
select{
    font-family:inherit;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:20px;
}

/* =========================================================
APP
========================================================= */

.app{
    display:flex;
    flex-direction:column;
    height:100%;
}

/* =========================================================
HEADER
========================================================= */

header{
    height:72px;
    min-height:72px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    z-index:100;
}

.logo{
    font-size:1.3rem;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--primary);
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================================================
BUTTONS
========================================================= */

.btn{
    border:none;
    cursor:pointer;
    border-radius:14px;
    padding:11px 15px;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-light{
    background:#eef2ff;
    color:#312e81;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-dark{
    background:#0f172a;
    color:white;
}

/* =========================================================
MAIN LAYOUT
========================================================= */

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* =========================================================
SIDEBAR
========================================================= */

.sidebar{
    width:390px;
    background:var(--panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
}

.section{
    padding:22px;
    border-bottom:1px solid var(--border);
}

.section-title{
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:16px;
}

.group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.input,
.select{
    width:100%;
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    outline:none;
    background:white;
}

.range{
    width:100%;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
    font-weight:600;
    color:#334155;
}

/* =========================================================
EDITOR
========================================================= */

#editor{
    min-height:260px;
    border:1px solid var(--border);
    border-radius:24px;
    padding:20px;
    background:white;
    outline:none;
    font-size:22px;
    line-height:1.6;
}

/* =========================================================
WORKSPACE
========================================================= */

.workspace{
    flex:1;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px;
    background:
    radial-gradient(#dbeafe 1px, transparent 1px);
    background-size:24px 24px;
}

/* =========================================================
CANVAS
========================================================= */

.canvas-shell{
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:var(--shadow);
    position:relative;
}

#svgCanvas{
    display:block;
    background:white;
}

/* =========================================================
MOBILE
========================================================= */

.mobile-nav{
    display:none;
}

@media(max-width:900px){

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:calc(100vh - 130px);
        display:none;
    }

    .workspace{
        display:none;
        padding:18px;
    }

    .sidebar.active{
        display:block;
    }

    .workspace.active{
        display:flex;
    }

    .mobile-nav{
        display:flex;
        justify-content:space-around;
        align-items:center;
        padding:12px;
        background:white;
        border-top:1px solid var(--border);
    }

    .mobile-nav button{
        border:none;
        background:none;
        font-weight:700;
        color:#64748b;
    }

    .mobile-nav button.active{
        color:var(--primary);
    }

}

</style>

</head>
<body>

<div class="app">

<!-- =========================================================
HEADER
========================================================= -->

<header>

<div class="logo">
Text<span>.</span>To<span>.</span>Image
</div>

<div class="header-actions">

<button class="btn btn-light" onclick="resetStudio()">
Reset Project
</button>

<button class="btn btn-dark" onclick="downloadSVG()">
⬇ Download Editable SVG
</button>

<button class="btn btn-dark" onclick="exportImage('jpg')">
⬇ Download JPG Image
</button>

<button class="btn btn-primary" onclick="exportImage('png')">
⬇ Download PNG Image
</button>

</div>

</header>

<!-- =========================================================
MAIN
========================================================= -->

<div class="main">

<!-- =========================================================
SIDEBAR
========================================================= -->

<aside class="sidebar active" id="sidebar">

<!-- =========================================================
TEXT
========================================================= -->

<div class="section">

<div class="section-title">
Text Editor
</div>

<div class="group" style="margin-bottom:14px;">

<button class="btn btn-light" onclick="cmd('bold')">
Bold
</button>

<button class="btn btn-light" onclick="cmd('italic')">
Italic
</button>

<button class="btn btn-light" onclick="cmd('underline')">
Underline
</button>

<button class="btn btn-light" onclick="cmd('strikeThrough')">
Strike
</button>

<button class="btn btn-light" onclick="alignText('left')">
Left
</button>

<button class="btn btn-light" onclick="alignText('center')">
Center
</button>

<button class="btn btn-light" onclick="alignText('right')">
Right
</button>

</div>

<div
id="editor"
contenteditable="true"
oninput="syncEditor()">

<h1>Text To Image Tool</h1>

<p>
Create beautiful full page text images with SVG rendering.
</p>

<ul>
<li>HD PNG Export</li>
<li>HD JPG Export</li>
<li>Editable SVG Export</li>
<li>Background Image Controls</li>
<li>Paper Sizes</li>
</ul>

</div>

</div>

<!-- =========================================================
TYPOGRAPHY
========================================================= -->

<div class="section">

<div class="section-title">
Typography
</div>

<label>
Font Family
</label>

<select class="select" onchange="updateFont(this.value)">
<option>Inter</option>
<option>Poppins</option>
<option>Montserrat</option>
<option>Roboto</option>
<option>Playfair Display</option>
<option>Oswald</option>
<option>Bebas Neue</option>
<option>Anton</option>
<option>Fira Code</option>
<option>Lobster</option>
<option>Pacifico</option>
</select>

<br><br>

<label>
Font Size
</label>

<input
class="range"
type="range"
min="12"
max="120"
value="32"
oninput="updateTextStyle('fontSize', this.value + 'px')"
/>

<br><br>

<label>
Line Height
</label>

<input
class="range"
type="range"
min="1"
max="3"
step="0.1"
value="1.5"
oninput="updateTextStyle('lineHeight', this.value)"
/>

<br><br>

<label>
Letter Spacing
</label>

<input
class="range"
type="range"
min="0"
max="20"
value="0"
oninput="updateTextStyle('letterSpacing', this.value + 'px')"
/>

<br><br>

<label>
Text Color
</label>

<input
class="input"
type="color"
value="#111111"
oninput="updateTextColor(this.value)"
/>

</div>

<!-- =========================================================
PAPER SIZE
========================================================= -->

<div class="section">

<div class="section-title">
Canvas & Paper Size
</div>

<select class="select" onchange="setPaper(this.value)">

<option value="1080x1080">
Instagram Square
</option>

<option value="1080x1920">
Story / Reel
</option>

<option value="1920x1080">
YouTube Thumbnail
</option>

<option value="794x1123">
A4 Paper
</option>

<option value="1123x1587">
A3 Paper
</option>

<option value="1587x2245">
A2 Paper
</option>

<option value="595x842">
Letter
</option>

<option value="custom">
Custom
</option>

</select>

<br><br>

<label>
Canvas Width
</label>

<input
class="input"
id="customWidth"
type="number"
value="1080"
/>

<br><br>

<label>
Canvas Height
</label>

<input
class="input"
id="customHeight"
type="number"
value="1080"
/>

<br><br>

<button
class="btn btn-primary"
style="width:100%;"
onclick="applyCustomCanvas()">

Apply Custom Canvas

</button>

</div>

<!-- =========================================================
BACKGROUND
========================================================= -->

<div class="section">

<div class="section-title">
Background Image Studio
</div>

<label>
Background Color
</label>

<input
class="input"
type="color"
value="#ffffff"
oninput="updateBackgroundColor(this.value)"
/>

<br><br>

<label>
Upload Background Image
</label>

<input
class="input"
type="file"
accept="image/*"
onchange="uploadBackground(this)"
/>

<br><br>

<label>
Background Position X
</label>

<input
class="range"
type="range"
min="-500"
max="500"
value="0"
oninput="bgPosX=this.value; renderSVG();"
/>

<br><br>

<label>
Background Position Y
</label>

<input
class="range"
type="range"
min="-500"
max="500"
value="0"
oninput="bgPosY=this.value; renderSVG();"
/>

<br><br>

<label>
Background Zoom
</label>

<input
class="range"
type="range"
min="20"
max="300"
value="100"
oninput="bgScale=this.value; renderSVG();"
/>

<br><br>

<label>
Background Rotation
</label>

<input
class="range"
type="range"
min="-180"
max="180"
value="0"
oninput="bgRotate=this.value; renderSVG();"
/>

<br><br>

<label>
Background Opacity
</label>

<input
class="range"
type="range"
min="0"
max="1"
step="0.05"
value="1"
oninput="bgOpacity=this.value; renderSVG();"
/>

<br><br>

<label>
Background Blur
</label>

<input
class="range"
type="range"
min="0"
max="40"
value="0"
oninput="bgBlur=this.value; renderSVG();"
/>

</div>

</aside>

<!-- =========================================================
WORKSPACE
========================================================= -->

<section class="workspace active" id="workspace">

<div class="canvas-shell">

<svg
id="svgCanvas"
xmlns="http://www.w3.org/2000/svg"
width="1080"
height="1080">

</svg>

</div>

</section>

</div>

<!-- =========================================================
MOBILE NAV
========================================================= -->

<nav class="mobile-nav">

<button
class="active"
id="editBtn"
onclick="showPanel('edit')">

EDIT

</button>

<button
id="previewBtn"
onclick="showPanel('preview')">

PREVIEW

</button>

</nav>

</div>

<script>

/* =========================================================
STATE
========================================================= */

const editor = document.getElementById("editor");
const svgCanvas = document.getElementById("svgCanvas");

let canvasWidth = 1080;
let canvasHeight = 1080;

let bgColor = "#ffffff";
let bgImage = "";

let bgPosX = 0;
let bgPosY = 0;
let bgScale = 100;
let bgRotate = 0;
let bgOpacity = 1;
let bgBlur = 0;

let textColor = "#111111";

/* =========================================================
TEXT COMMANDS
========================================================= */

function cmd(command){

    document.execCommand(command,false,null);

    syncEditor();

}

function alignText(type){

    editor.style.textAlign = type;

    syncEditor();

}

/* =========================================================
TEXT STYLE
========================================================= */

function updateFont(font){

    editor.style.fontFamily = font;

    syncEditor();

}

function updateTextStyle(prop,val){

    editor.style[prop] = val;

    syncEditor();

}

function updateTextColor(color){

    textColor = color;

    editor.style.color = color;

    syncEditor();

}

/* =========================================================
BACKGROUND
========================================================= */

function updateBackgroundColor(color){

    bgColor = color;

    renderSVG();

}

function uploadBackground(input){

    const file = input.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        bgImage = e.target.result;

        renderSVG();

    }

    reader.readAsDataURL(file);

}

/* =========================================================
PAPER
========================================================= */

function setPaper(size){

    if(size === "custom") return;

    const arr = size.split("x");

    canvasWidth = parseInt(arr[0]);
    canvasHeight = parseInt(arr[1]);

    renderSVG();

}

function applyCustomCanvas(){

    canvasWidth =
    parseInt(document.getElementById("customWidth").value);

    canvasHeight =
    parseInt(document.getElementById("customHeight").value);

    renderSVG();

}

/* =========================================================
SYNC
========================================================= */

function syncEditor(){

    renderSVG();

}

/* =========================================================
SVG RENDER
========================================================= */

function renderSVG(){

    svgCanvas.setAttribute("width",canvasWidth);
    svgCanvas.setAttribute("height",canvasHeight);

    let bgLayer = `
    <rect
    width="100%"
    height="100%"
    fill="${bgColor}" />
    `;

    if(bgImage){

        bgLayer += `
        <defs>

            <filter id="bgFx">
                <feGaussianBlur stdDeviation="${bgBlur}" />
            </filter>

        </defs>

        <image
        href="${bgImage}"
        x="${bgPosX}"
        y="${bgPosY}"
        width="${canvasWidth * (bgScale/100)}"
        height="${canvasHeight * (bgScale/100)}"
        opacity="${bgOpacity}"
        filter="url(#bgFx)"
        preserveAspectRatio="xMidYMid slice"
        transform="
        rotate(
        ${bgRotate}
        ${canvasWidth/2}
        ${canvasHeight/2}
        )"
        />
        `;
    }

    const html = editor.innerHTML;

    svgCanvas.innerHTML = `

    ${bgLayer}

    <foreignObject
    x="60"
    y="60"
    width="${canvasWidth-120}"
    height="${canvasHeight-120}">

        <div xmlns="http://www.w3.org/1999/xhtml"
        style="
        width:100%;
        height:100%;
        color:${textColor};
        font-family:${getComputedStyle(editor).fontFamily};
        font-size:${getComputedStyle(editor).fontSize};
        line-height:${getComputedStyle(editor).lineHeight};
        letter-spacing:${getComputedStyle(editor).letterSpacing};
        overflow-wrap:break-word;
        ">

        ${html}

        </div>

    </foreignObject>

    `;

}

/* =========================================================
DOWNLOAD SVG
========================================================= */

function downloadSVG(){

    const data =
    new XMLSerializer().serializeToString(svgCanvas);

    const blob =
    new Blob([data],{
        type:"image/svg+xml"
    });

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download = "Text-To-Image.svg";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

}

/* =========================================================
EXPORT PNG/JPG
========================================================= */

function exportImage(type){

    const svgData =
    new XMLSerializer().serializeToString(svgCanvas);

    const svgBlob =
    new Blob(
        [svgData],
        {
            type:"image/svg+xml;charset=utf-8"
        }
    );

    const url =
    URL.createObjectURL(svgBlob);

    const img =
    new Image();

    img.onload = function(){

        const canvas =
        document.createElement("canvas");

        canvas.width = canvasWidth * 2;

        canvas.height = canvasHeight * 2;

        const ctx =
        canvas.getContext("2d");

        if(type === "jpg"){

            ctx.fillStyle = bgColor;

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

        }

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const link =
        document.createElement("a");

        link.download =
        `Text-To-Image.${type}`;

        link.href =
        canvas.toDataURL(
            `image/${type}`,
            1
        );

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    }

    img.onerror = function(){

        alert("Image export failed.");

    }

    img.src = url;

}

/* =========================================================
RESET
========================================================= */

function resetStudio(){

    location.reload();

}

/* =========================================================
MOBILE PANEL
========================================================= */

function showPanel(type){

    const sidebar =
    document.getElementById("sidebar");

    const workspace =
    document.getElementById("workspace");

    const editBtn =
    document.getElementById("editBtn");

    const previewBtn =
    document.getElementById("previewBtn");

    if(type === "edit"){

        sidebar.classList.add("active");

        workspace.classList.remove("active");

        editBtn.classList.add("active");

        previewBtn.classList.remove("active");

    }else{

        workspace.classList.add("active");

        sidebar.classList.remove("active");

        previewBtn.classList.add("active");

        editBtn.classList.remove("active");

    }

}

/* =========================================================
INIT
========================================================= */

window.onload = function(){

    renderSVG();

}

</script>

</body>
</html>
